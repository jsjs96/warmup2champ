<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웜업존에서 MVP까지 — 배구 커리어 시뮬레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --court:#1D4E9E; --court-2:#173F82; --court-line:rgba(255,255,255,.9);
  --paper:#F6F8FB; --grid:#E3E9F3; --ink:#0F1B33; --muted:#5B6782; --rule:#D3DBE8;
  --led:#FFB020; --led-dim:rgba(255,176,32,.10); --board:#000; --board-2:#14171D;
  --antenna:#E1252B; --go:#2FD27A; --blue-ink:#1D4E9E;
  --r-board:10px; --r-paper:6px; --r-ctl:4px;
  --f-display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--court)}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.6 var(--f-body);
  background:
    radial-gradient(120% 60% at 50% 0%, #2459B3 0%, var(--court) 55%, var(--court-2) 100%);
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 56px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--led);outline-offset:2px}
h2,h3,.display{font-family:var(--f-display);font-weight:400;margin:0;letter-spacing:-.2px}

/* ---------- 전광판 ---------- */
.board{background:var(--board);color:#fff;border-radius:var(--r-board);padding:14px;
  box-shadow:0 0 0 3px #22262E,0 0 0 4px #000,0 14px 30px rgba(3,10,30,.45)}
.board-top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.mini-court{width:64px;height:80px;border-radius:4px;background:var(--court);position:relative;overflow:hidden}
.mini-court::before{content:"";position:absolute;left:0;right:0;top:22px;height:2px;background:var(--court-line)}
.mini-court canvas{position:absolute;left:8px;bottom:0;width:48px;height:64px;image-rendering:pixelated}
.who .nm{font-family:var(--f-display);font-size:26px;line-height:1.1;color:var(--led);
  text-shadow:0 0 10px rgba(255,176,32,.45)}
.who .meta{font-size:12.5px;color:#AEB6C6;line-height:1.45;margin-top:2px}
.who .meta strong{color:#fff;font-weight:500}
.ovrbox{text-align:center}
.lbl{font-size:11px;color:#8992A3;letter-spacing:.2px}
.board-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.board-row .cell{background:var(--board-2);border-radius:4px;padding:6px 6px 7px}
.board-row svg{display:block;margin-top:4px;max-width:100%}
.lamps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px;position:relative}
.lamps::before{content:"";position:absolute;left:12.5%;right:12.5%;top:7px;height:2px;background:#2A2F39}
.lamp{text-align:center;font-size:11.5px;color:#6E7686;position:relative}
.lamp i{display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 4px;background:#262A33;border:2px solid #000}
.lamp.on{color:#fff}
.lamp.on i{background:var(--led);box-shadow:0 0 12px 2px rgba(255,176,32,.7)}
.lamp.past i{background:#6B4A0E}
.lamp.hurt i{background:var(--antenna);box-shadow:0 0 12px 2px rgba(225,37,43,.7)}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:4px}
.seg b{height:9px;border-radius:1px;background:#1E222A}
.seg.cond b.on{background:var(--go);box-shadow:0 0 6px rgba(47,210,122,.6)}
.seg.cond.low b.on{background:var(--antenna);box-shadow:0 0 6px rgba(225,37,43,.6)}
.seg.trust b.on{background:var(--led);box-shadow:0 0 6px rgba(255,176,32,.5)}
.gauges .lbl{display:flex;justify-content:space-between}
.gauges .lbl em{font-style:normal;color:#fff}

/* ---------- 탭 (코트 라인) ---------- */
.tabs{display:flex;margin:18px 2px 4px;border-bottom:3px solid rgba(255,255,255,.25)}
.tab{flex:1;background:none;border:0;padding:8px 2px 9px;color:rgba(255,255,255,.65);font-family:var(--f-display);font-size:17px;
  margin-bottom:-3px;border-bottom:3px solid transparent}
.tab[aria-selected=true]{color:#fff;border-bottom-color:#fff}

/* ---------- 기록지 패널 ---------- */
.paper{background:var(--paper);border-radius:var(--r-paper);padding:16px;margin:14px 0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100% 28px,28px 100%;background-position:0 -1px,-1px 0;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 24px rgba(6,22,60,.28)}
.paper.plain{background-image:none}
.paper h2{font-size:26px;line-height:1.2;margin:2px 0 6px}
.paper h3{font-size:19px;margin:0 0 6px}
.paper p{margin:6px 0}
.muted{color:var(--muted);font-size:13.5px}
.season-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:6px}
.season-head .yr{font-family:var(--f-display);font-size:15px;color:var(--blue-ink)}
.season-head .wl{font-size:13px;color:var(--muted)}
.steps{display:flex;gap:4px;margin:2px 0 10px}
.steps i{flex:1;height:5px;border-radius:2px;background:var(--rule)}
.steps i.done{background:var(--blue-ink)}
.steps i.now{background:var(--led)}

.notice{border-left:4px solid var(--blue-ink);background:#fff;padding:9px 12px;margin:10px 0;border-radius:0 4px 4px 0}
.notice strong{font-family:var(--f-display);font-weight:400;font-size:17px;display:block;line-height:1.3}
.notice.warm{border-left-color:#8A93A6}
.notice.hurt{border-left-color:var(--antenna)}
.notice.start{border-left-color:var(--go)}

/* 훈련 버튼 */
.drills{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.drill{position:relative;text-align:left;background:#fff;border:1.5px solid var(--rule);border-radius:var(--r-ctl);padding:10px 12px 10px 14px;min-height:62px}
.drill:hover{border-color:var(--blue-ink)}
.drill:active{transform:translateY(1px)}
.drill .t{font-weight:700;display:block;line-height:1.3}
.drill .d{font-size:12.5px;color:var(--muted)}
.drill.key::before{content:"";position:absolute;left:-1.5px;top:-1.5px;bottom:-1.5px;width:5px;background:var(--blue-ink);border-radius:var(--r-ctl) 0 0 var(--r-ctl)}
.drill .tag{position:absolute;right:8px;top:8px;font-size:11px;color:var(--blue-ink);font-weight:700}
.drill.risk .tag{color:var(--antenna)}
.legend{font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:5px;height:12px;background:var(--blue-ink);vertical-align:-1px;margin-right:6px}

/* 일반 버튼 */
.btn{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--rule);border-radius:var(--r-ctl);padding:11px 14px;margin:8px 0}
.btn:hover{border-color:var(--ink)}
.btn small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.btn.go{background:var(--led);border-color:#D88F06;font-family:var(--f-display);font-size:18px;text-align:center;color:#1A1203;box-shadow:0 3px 0 #C07E00}
.btn.go:active{transform:translateY(2px);box-shadow:0 1px 0 #C07E00}
.btn.go small{color:#5A3E00;font-family:var(--f-body)}
.btn.court{background:var(--blue-ink);color:#fff;border-color:var(--blue-ink)}
.btn.court small{color:#C9D6F0}
.btn.quiet{text-align:center;background:transparent}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* 리포트 */
.report{margin:8px 0 4px;padding:0;list-style:none}
.report li{padding:7px 0;border-bottom:1px solid var(--rule)}
.report li:first-child{font-weight:700}
.report li:last-child{border-bottom:0}

/* 기록 표 */
.sheet{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--ink);border-radius:3px;margin:10px 0;background:#fff}
.sheet div{padding:6px 6px 7px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.sheet div:nth-child(4n){border-right:0}
.sheet span{display:block;font-size:11.5px;color:var(--muted)}
.sheet b{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.2}
.tablewrap{overflow-x:auto;margin:8px -4px 0}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;background:#fff}
th{font-weight:700;font-size:12px;color:var(--muted);text-align:right;padding:6px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
td{padding:6px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}

/* 능력치 */
.stat{display:grid;grid-template-columns:76px 1fr 30px;gap:10px;align-items:center;padding:5px 0}
.stat .k{font-size:14px}
.stat.key .k{font-weight:700}
.stat .v{text-align:right;font-family:var(--f-display);font-size:18px}
.meter{height:10px;background:#fff;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:#9AA6BD}
.stat.key .meter i{background:var(--blue-ink)}

/* 로그 */
.log{max-height:300px;overflow:auto;margin-top:6px}
.log p{margin:0;padding:7px 0 7px 12px;border-bottom:1px solid var(--rule);font-size:13.5px;position:relative}
.log p::before{content:"";position:absolute;left:0;top:13px;width:5px;height:5px;border-radius:50%;background:var(--rule)}
.log p.hi::before{background:var(--blue-ink)}
.log p.good::before{background:var(--go)}
.log p.bad::before{background:var(--antenna)}

/* 결정적 순간: 안테나 */
.clutch{position:relative;padding-left:30px}
.clutch::before{content:"";position:absolute;left:10px;top:12px;bottom:12px;width:8px;border-radius:4px;
  background:repeating-linear-gradient(180deg,var(--antenna) 0 14px,#fff 14px 28px);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.mini-board{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--board);color:#fff;border-radius:6px;padding:10px 12px;margin:4px 0 12px}
.mini-board .side{font-family:var(--f-display);font-size:15px;color:#AEB6C6;max-width:30%;line-height:1.2}
.mini-board .side.me{color:var(--led)}
.say{font-family:var(--f-display);font-size:21px;line-height:1.4;margin:6px 0 10px}
.odds{display:inline-flex;gap:2px;vertical-align:-1px;margin-left:4px}
.odds i{width:7px;height:10px;border-radius:1px;background:var(--rule)}
.odds i.on{background:var(--blue-ink)}
.verdict{font-family:var(--f-display);font-size:30px;line-height:1.2;margin:4px 0}
.verdict.ok{color:#11804A}.verdict.no{color:var(--antenna)}

/* 트로피 */
.trophy{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.trophy .ic{font-size:24px;text-align:center}
.trophy .n{font-family:var(--f-display);font-size:20px}
.empty{padding:18px 0;color:var(--muted)}

/* 생성 화면 */
.field{margin-top:16px}
.field>.label{font-weight:700;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between}
.field>.label span{font-weight:400;color:var(--muted)}
.namebox{display:flex;gap:8px}
input[type=text]{flex:1;font:inherit;font-family:var(--f-display);font-size:20px;padding:8px 12px;border:1.5px solid var(--ink);border-radius:var(--r-ctl);background:#fff;color:var(--ink)}
.seg-ctl{display:grid;gap:0;border:1.5px solid var(--ink);border-radius:var(--r-ctl);overflow:hidden;background:#fff}
.seg-ctl.c2{grid-template-columns:1fr 1fr}.seg-ctl.c3{grid-template-columns:1fr 1fr 1fr}
.seg-ctl button{background:#fff;border:0;border-right:1px solid var(--rule);padding:9px 6px;text-align:center}
.seg-ctl button:last-child{border-right:0}
.seg-ctl button small{display:block;font-size:11.5px;color:var(--muted)}
.seg-ctl button[aria-pressed=true]{background:var(--blue-ink);color:#fff}
.seg-ctl button[aria-pressed=true] small{color:#C9D6F0}
.pos-list{display:grid;gap:6px}
.pos{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;text-align:left;background:#fff;border:1.5px solid var(--rule);border-radius:var(--r-ctl);padding:8px 10px}
.pos b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--blue-ink);text-align:center}
.pos small{display:block;color:var(--muted);font-size:12.5px}
.pos[aria-pressed=true]{border-color:var(--blue-ink);box-shadow:inset 0 0 0 1.5px var(--blue-ink);background:#EEF3FC}
input[type=range]{width:100%;accent-color:var(--blue-ink)}

/* 타이틀 */
.title-board{padding:18px 14px 16px}
.score-line{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.score-line .team{font-family:var(--f-display);font-size:22px;text-align:center;line-height:1.15}
.score-line .team.home{color:#AEB6C6}.score-line .team.away{color:var(--led);text-shadow:0 0 12px rgba(255,176,32,.5)}
.score-line .team small{display:block;font-family:var(--f-body);font-size:11px;color:#6E7686;margin-top:2px}
.set-no{text-align:center;color:#6E7686;font-size:12px;margin-top:10px}
.title{color:#fff;margin:26px 2px 6px}
.title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,12vw,58px);line-height:1.02;margin:0;letter-spacing:-1px}
.title p{color:#D4DEF2;margin:10px 0 0;max-width:30em}
.court-hero{display:flex;align-items:flex-end;gap:14px;margin:18px 2px}
.court-hero canvas{width:72px;height:96px;image-rendering:pixelated}
.court-hero .ball{width:24px;height:24px;margin-bottom:70px}
.hof-mini td:first-child{width:22px}
.end-grade{display:flex;align-items:center;gap:16px;margin:10px 0}

.foot{color:rgba(255,255,255,.6);font-size:12px;text-align:center;margin-top:26px}
.foot button{background:none;border:1px solid rgba(255,255,255,.35);border-radius:var(--r-ctl);color:#fff;padding:5px 12px;margin-top:8px;font-size:12.5px}

/* 도트 장면 */
.scene{margin:10px 0 12px;background:#000;border-radius:6px;padding:6px;overflow:hidden}
.scene canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:3px}
.scene figcaption{color:#AEB6C6;font-size:12.5px;padding:6px 4px 1px}
.title + .scene, .title ~ .scene{margin:16px 0}
/* 엠블럼 (팀 컬러 약칭 배지) */
.emblem{--s:22px;display:inline-grid;place-items:center;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);color:#fff;
  font-family:var(--f-display);font-size:calc(var(--s)*.36);line-height:1;letter-spacing:-.5px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 0 0 1px rgba(0,0,0,.25);flex:none;vertical-align:middle;white-space:nowrap;overflow:hidden}
.team-line{display:flex;align-items:center;gap:6px}
.c-head{display:flex;align-items:center;gap:12px;margin:4px 0 10px}
/* 계약서 */
.contract{position:relative}
.terms{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid var(--ink);border-radius:3px;margin:8px 0;background:#fff}
.terms div{padding:8px 10px;border-bottom:1px solid var(--rule)}
.terms div:nth-child(odd){border-right:1px solid var(--rule)}
.terms div:nth-last-child(-n+2){border-bottom:0}
.terms dt{font-size:11.5px;color:var(--muted)}
.terms dd{margin:0;font-weight:500}
.clauses{padding-left:20px;margin:10px 0;font-size:13.5px;color:#2C3954}
.clauses li{margin:3px 0}
.sign-row{display:grid;grid-template-columns:90px 1fr;gap:10px;margin:14px 0 6px;align-items:stretch}
.club-sign{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px dashed var(--rule);border-radius:4px;padding:8px}
.pad-wrap{position:relative;display:flex;flex-direction:column;gap:4px}
#sig{width:100%;height:110px;background:#fff;border:1.5px solid var(--ink);border-radius:4px;touch-action:none;cursor:crosshair;
  background-image:linear-gradient(transparent 84px,var(--rule) 84px,var(--rule) 85px,transparent 85px)}
.pad-hint{position:absolute;left:0;right:0;top:58px;text-align:center;color:#A3ADC2;pointer-events:none;transition:opacity .2s}
.stamp{position:absolute;right:-6px;bottom:-4px;width:58px;height:58px;border:3px solid var(--antenna);border-radius:50%;color:var(--antenna);
  font-family:var(--f-display);font-size:13px;line-height:1.1;display:grid;place-items:center;text-align:center;transform:rotate(-14deg) scale(2.2);opacity:0;background:rgba(255,255,255,.6)}
.contract.signed .stamp{animation:stamp .35s cubic-bezier(.3,1.6,.6,1) forwards}
@keyframes stamp{to{transform:rotate(-14deg) scale(1);opacity:.92}}
.sig-show{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--rule);border-radius:4px;padding:6px 10px;margin:6px 0 10px}
.sig-show img{height:46px;width:auto;max-width:60%}
/* 레전드 비교 */
.legend{background:#fff;border:1.5px solid var(--rule);border-radius:4px;padding:12px;margin:8px 0}
.legend.twin{border:1.5px solid var(--blue-ink);box-shadow:inset 4px 0 0 var(--blue-ink)}
.legend header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.legend h3{margin:0}
.legend .pct{text-align:right}
.legend .pct b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1;color:var(--blue-ink)}
.legend .pct span{font-size:11px;color:var(--muted)}
.vs{display:grid;grid-template-columns:118px 1fr auto;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.vs .meter i{background:var(--blue-ink)}
.vs .v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.vs .v small{color:var(--muted)}
.tabs .tab{font-size:16px}
.news-col{margin:12px 0 4px}
.news-col h3{margin-bottom:4px}
.news{background:#fff;border:1px solid var(--rule);border-top:3px solid var(--ink);padding:10px 12px;margin:8px 0;border-radius:0 0 4px 4px}
.news .hl{font-family:var(--f-display);font-size:18px;line-height:1.35;margin:0 0 4px}
.news .bd{font-size:13.5px;color:#2C3954;margin:0}
.tip{font-size:13px;background:#FFF6DF;border:1px solid #F3D48A;border-radius:4px;padding:6px 9px;margin:8px 0 0}
.tip b{color:#8A5A00;margin-right:6px}
.arc{padding:7px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.submit-box{background:#fff;border:1.5px solid var(--blue-ink);border-radius:4px;padding:12px;margin:12px 0}
/* 대표팀 소집 통보: 태극 문양의 빨강·파랑 띠 */
.callup .doc{background:#fff;border:1.5px solid var(--ink);border-radius:4px;padding:14px 14px 10px;position:relative;margin-top:6px}
.callup .doc::before{content:"";position:absolute;left:-1.5px;right:-1.5px;top:-1.5px;height:6px;border-radius:4px 4px 0 0;background:linear-gradient(90deg,#CD2E3A 0 50%,#0047A0 50% 100%)}
.callup .doc h2{margin:2px 0 8px}
.callup .doc p{font-size:13.5px;color:#2C3954}

/* 경기 기록지 */
.ss{background:#fff;border:1.5px solid var(--ink);border-radius:4px;margin:10px 0}
.ss summary{cursor:pointer;padding:10px 12px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ss summary::-webkit-details-marker{display:none}
.ss summary::after{content:"펼치기";font-weight:400;font-size:12.5px;color:var(--blue-ink)}
.ss[open] summary::after{content:"접기"}
.ss summary .muted{font-weight:400}
.ss-body{padding:0 12px 12px;border-top:1px solid var(--rule)}
.ss-table{margin-top:10px;font-size:13px}
.ss-table th{font-size:11.5px}
.ss-table tr.w td{font-weight:700;color:var(--blue-ink)}
.ss-table td,.ss-table th{text-align:center}
.ss-table .l{text-align:left;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.ss-me{margin-top:12px}
.ss-cap{font-weight:700;font-size:13.5px;margin:0 0 6px}
.ss-star{font-weight:400;font-size:11.5px;background:var(--led);color:#1A1203;border-radius:3px;padding:1px 6px;margin-left:4px}
.ss-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:3px}
.ss-grid div{padding:5px 7px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.ss-grid div:nth-child(4n){border-right:0}
.ss-grid span{display:block;font-size:11px;color:var(--muted)}
.ss-grid b{font-family:var(--f-display);font-weight:400;font-size:18px}
/* 감독과의 대화 */
.talk-btn{border-color:var(--blue-ink);border-left-width:5px;margin-top:12px}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0 12px}
.bubble{max-width:86%;margin:0;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.5}
.bubble span{display:block;font-size:11px;opacity:.75;margin-bottom:1px}
.bubble.coach{align-self:flex-start;background:#fff;border:1px solid var(--rule);border-bottom-left-radius:3px}
.bubble.me{align-self:flex-end;background:var(--blue-ink);color:#fff;border-bottom-right-radius:3px}
/* FA 제안 */
.offers{display:grid;gap:10px;margin:10px 0}
.offer{background:#fff;border:1.5px solid var(--rule);border-radius:4px;padding:12px}
.offer header{display:flex;gap:10px;align-items:center}
.offer.gone{opacity:.55}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--rule)}
.offer-terms{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:10px 0 4px;border:1px solid var(--rule);border-radius:3px}
.offer-terms div{padding:5px 7px;border-right:1px solid var(--rule)}
.offer-terms div:last-child{border-right:0}
.offer-terms dt{font-size:11px;color:var(--muted)}
.offer-terms dd{margin:0;font-weight:700;font-size:13.5px}
/* 부상 */
.injury{border-left:6px solid var(--antenna)}
/* 라이벌 */
.legend.rival{border-color:#9AA6BD}
.rv-chart{width:100%;height:auto;margin-top:6px;background:#F6F8FB;border-radius:3px}
.rv-legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin:0 4px 0 8px}
/* 공유 카드 */
.share-img{background:#0E1A33;border-radius:6px;padding:8px;margin:8px 0;text-align:center}
.share-img img{display:block;width:100%;max-width:360px;margin:0 auto;border-radius:4px}
.share-img img:not([src]){display:none}
.share-img .muted{color:#AEB6C6}
.rail{display:none}
.emblem.has-logo{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.emblem.has-logo img{width:76%;height:76%;object-fit:contain;display:block}
.bulk{background:#fff;border:1.5px dashed var(--blue-ink);border-radius:4px;padding:10px 12px;margin:10px 0}
.bulk .muted{margin:6px 0 0;font-size:12.5px}
.bulk-pick{cursor:pointer;margin:0}
.logo-list{display:grid;gap:8px;margin:8px 0}
.logo-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--rule);border-radius:4px;padding:8px 10px}
.logo-name{display:flex;flex-direction:column;line-height:1.35}
.logo-name .muted{font-size:12px}
.logo-pick,.logo-del{width:auto;margin:0;padding:7px 9px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.hof tr.friend td{background:#F2F6FD}
.mini{font:inherit;font-size:12px;padding:2px 8px;border:1px solid var(--rule);background:#fff;border-radius:3px;color:var(--blue-ink)}
.code-row td{background:#F6F8FB;text-align:left;white-space:normal}
.codebox{display:flex;gap:8px;align-items:center}
.codebox input{flex:1;min-width:0;font:12.5px/1.4 var(--f-body);padding:7px 9px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink)}
.codemsg{margin:6px 0 0;font-size:12.5px}
.friend-add{margin-top:14px;padding-top:12px;border-top:1px dashed var(--rule)}
.friend-add label{display:block;margin-bottom:6px;font-size:13.5px}
.friend-add input{font-family:var(--f-body);font-size:14px}
.foot button + button{margin-left:6px}
/* QA 수정 */
.namebox>.btn,.namebox>button{flex:none;white-space:nowrap}
.namebox input{min-width:0}
.field>.label{display:block}
.field>.label span{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:1px}
.pos{width:100%}
.ss-body{overflow-x:auto}
.ss-table{table-layout:fixed;width:100%;min-width:0}
.ss-table th:first-child,.ss-table td:first-child{width:34%}
.ss-table td,.ss-table th{padding:6px 3px}
.ss-team th:first-child,.ss-team td:first-child{width:24%}
.mini{min-height:32px;min-width:44px}
.codebox input{font-size:12px}
.codebox input{word-break:break-all}
.rail>.paper:first-child{margin-top:0}
@media (max-width:480px){
  .sm-hide{display:none}
  .ss-table{font-size:12px}
  .ss-table th{font-size:10.5px}
  .ss-team th:first-child,.ss-team td:first-child{width:22%}
}
.log-side{display:none}

/* ---------- 태블릿 (720px~) ---------- */
@media (min-width:720px){
  .wrap{max-width:860px;padding:24px 24px 56px}
  .who .nm{font-size:30px}
  .drills{grid-template-columns:repeat(3,1fr)}
  .news-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
  .news-col h3{grid-column:1/-1;margin-bottom:-2px}
  .news{margin:0}
  .offers{grid-template-columns:1fr 1fr}
  .title-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;margin:16px 0 8px}
  .title-wrap .title{margin-top:18px}
  .title-act .scene{margin-top:0}
  .paper{padding:20px 22px}
  .sheet{grid-template-columns:repeat(4,1fr)}
}
/* ---------- PC·태블릿 가로 (1024px~): 전광판 왼쪽 고정 ---------- */
@media (min-width:1024px){
  .wrap{max-width:1240px;padding:28px 28px 64px}
  .layout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:28px;align-items:start}
  .side{position:sticky;top:20px}
  .side .tabs{margin-top:14px}
  .main{min-width:0;max-width:860px}
  .main>.paper:first-child,.main>section:first-child{margin-top:0}
  .log-side{display:block;margin-top:14px}
  .log-side .log{max-height:calc(100vh - 560px);min-height:110px}
  .main .log-main{display:none}
  .title-wrap{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;margin:28px 0 12px}
  .title-wrap ~ .paper{max-width:780px}
}
/* ---------- 넓은 모니터 (1440px~): 오른쪽에 뉴스·기록지 ---------- */
@media (min-width:1440px){
  .wrap{max-width:1560px}
  .layout{grid-template-columns:380px minmax(0,1fr) 340px}
  .main{max-width:none}
  .rail{display:block;position:sticky;top:20px}
  .rail .news-col{display:block}
  .rail .news{margin:8px 0}
  .rail .log{max-height:calc(100vh - 520px);min-height:120px}
  .log-side{display:none}
  .main .news-col{display:none}
}
@keyframes bob{50%{transform:translateY(-5px)}}
.court-hero canvas.p{animation:bob 1.2s steps(2) infinite}
@keyframes lit{from{opacity:.25}to{opacity:1}}
.flash-led svg{animation:lit .35s steps(3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.board-row{grid-template-columns:repeat(2,1fr)}.drills{grid-template-columns:1fr}.who .nm{font-size:22px}}

</style>
</head>

  const pot = clamp(Math.round(78 + gauss()*6.5 + (o.talent==='노력파'? -2: o.talent==='천재형'? 4:0)),70,97);
  const cap={};
  for(const k in STATS){ const rel=(w[k]||0)>=.1; cap[k]=clamp(Math.round((rel?pot:pot-14)+rnd(-4,4)),40,99); }

      P.push({k:'league',t:'정규리그 1~2라운드',n:12});

function blankStats(){return {gp:0,sets:0,pts:0,atkP:0,atkA:0,blk:0,ace:0,dig:0,rcvG:0,rcvT:0,ast:0};}
function curPhase(){ return S.season.phases[S.season.idx]; }

/* ---------- 출전 역할 ---------- */
function teamReq(){
  // 같은 포지션 주전 경쟁 기준
  return S.team.rating + (S.stage==='HS'?0:2);
}
function role(){
  if(S.injured>0) return {r:'부상',share:0};
  const cb = S.coachBoost && S.coachBoost.key===phaseKey() ? S.coachBoost.v : 0;
  const d = ovr() + (S.trust-50)*0.1 + cb - teamReq();
  if(d>=0) return {r:'주전',share:1};
  if(d>=-5) return {r:'교체',share:.5};
  if(d>=-10) return {r:'원포인트',share:.15};
  return {r:'웜업존',share:0};
}
function roleLabel(r){
  if(r==='원포인트') return S.pos==='L'?'수비 교체':S.pos==='S'?'원포인트 서버':'원포인트 투입';
  if(r==='교체') return '교체 투입';
  return r;
}

/* ---------- 훈련 ---------- */
const ACTIONS = [
  {id:'atk',t:'공격 훈련',d:'스파이크 · 타점',s:['atk','jmp']},
  {id:'blk',t:'블로킹 훈련',d:'손 모양 · 스텝',s:['blk','jmp']},
  {id:'srv',t:'서브 훈련',d:'스파이크 · 플로터',s:['srv','men']},
  {id:'def',t:'리시브·디그',d:'수비 기본기',s:['rcv','dig']},
  {id:'set',t:'토스 훈련',d:'세트 · 볼 배분',s:['set','men']},
  {id:'fit',t:'웨이트·체력',d:'몸 만들기',s:['sta','jmp']},
  {id:'vid',t:'영상 분석',d:'IQ · 감독 신뢰',s:['men']},
  {id:'rest',t:'휴식',d:'컨디션 회복',s:[]},
  {id:'hard',t:'지옥 특훈',d:'포지션 핵심 능력 ↑↑ · 부상 위험',s:[]},
];
function trainFactor(){ const a=S.age; return a<=18?.75:a<=21?.9:a<=24?.75:a<=27?.5:a<=30?.3:.18; }
function gain(k,mult){
  const s=S.stats[k], c=S.cap[k];
  const room = (c+3-s)/25;
  let g = (1.6+R()*1.6)*trainFactor()*clamp(room,0.12,1.3)*(mult||1);
  if(S.talent==='노력파') g*=1.12;
  if(S.coachTip && S.coachTip.key===phaseKey() && S.coachTip.k===k) g*=1.35;
  const before=s;
  S.stats[k]=clamp(r1(s+g),1,99);
  return r1(S.stats[k]-before);
}
function doAction(id){
  S.lastAct = S.injured>0?'rest':id;
  const a=ACTIONS.find(x=>x.id===id);
  const msgs=[];
  if(S.injured>0){
    S.cond=clamp(S.cond+30,0,100);
    S.lastMsg='재활에 전념했다. 컨디션 +30'; addLog(S.lastMsg,'');
  }else if(id==='rest'){
    S.cond=clamp(S.cond+38,0,100);
    S.trust=clamp(S.trust-1,0,100);
    S.lastMsg='푹 쉬었다. 컨디션 +38'; addLog(S.lastMsg,'');
  }else if(id==='hard'){
    const keys=Object.keys(POS[S.pos].w).filter(isKey);
    for(const k of keys){ const g=gain(k,1.25); if(g>0) msgs.push(`${STATS[k]} +${g}`); }
    S.cond=clamp(S.cond-32,0,100);
    S.trust=clamp(S.trust+3,0,100);
    S.lastMsg=`지옥 특훈: ${msgs.join(', ')}`; addLog(S.lastMsg,'hi');
    if(R() < (S.cond<35?0.35:0.12)*(S.reinj?1.6:1)){ injure(ri(1,2),'특훈 중 무리하다'); }
  }else{
    for(const k of a.s){ const g=gain(k, isKey(k)?1:0.8); if(g>0) msgs.push(`${STATS[k]} +${g}`); }
    if(id==='vid'){ S.trust=clamp(S.trust+4,0,100); msgs.push('감독 신뢰 +4'); }
    else if(a.s.some(isKey)) S.trust=clamp(S.trust+1.5,0,100);
    S.cond=clamp(S.cond-(id==='vid'?4:13),0,100);
    S.lastMsg=`${a.t}: ${msgs.join(', ')||'변화 없음 (한계에 가까움)'}`; addLog(S.lastMsg,'');
  }
}
function injure(n,why){ injureTyped(n,why); }

/* ---------- 경기 시뮬 ---------- */
function effTeam(share){
  // 팀 전력 = 팀 평점 + 내 기여도
  return S.team.rating + share*(ovr()-S.team.rating)*0.45 + (S.cond-60)*0.02*share;
}
function winProb(eff,opp,k){ return clamp(0.5+(eff-opp)*(k||0.035),0.05,0.95); }
function simStats(share,sum){
  if(share<=0) return null;
  const sets = share>=1? rnd(3,4.6) : share>=.5? rnd(1.2,2.6) : rnd(.3,1);
  const st=S.stats, p=S.pos, avg=stageAvg();
  const sc=(v)=>(v-avg);
  let pts=0;
  const att = {OH:8,OP:10,MB:4,S:.6,L:0}[p]*sets;
  const rate = clamp(0.42+sc((st.atk+st.jmp)/2)*0.005+gauss()*0.03,0.25,0.68);
  const ap = Math.round(att*rate);
  const bk = Math.max(0,Math.round(({OH:.25,OP:.32,MB:.55,S:.15,L:0}[p]+sc(st.blk)*0.006)*sets+gauss()*0.6));
  const ac = p==='L'?0:Math.max(0,Math.round((0.12+sc(st.srv)*0.004)*sets+gauss()*0.5));
  const dg = Math.max(0,Math.round(({OH:1.6,OP:.9,MB:.5,S:1.2,L:2.6}[p]+sc(st.dig)*0.03)*sets));
  const rT = Math.round(({OH:4,L:5.5,OP:.5,MB:0,S:0}[p])*sets);
  const rG = Math.round(rT*clamp(0.38+sc(st.rcv)*0.006,0.12,0.7));
  const as = p==='S'? Math.round((9.5+sc(st.set)*0.08)*sets):0;
  pts=ap+bk+ac;
  sum.gp++; sum.sets+=sets; sum.pts+=pts; sum.atkP+=ap; sum.atkA+=Math.round(att); sum.blk+=bk; sum.ace+=ac; sum.dig+=dg; sum.rcvG+=rG; sum.rcvT+=rT; sum.ast+=as;
  return {sets,pts,atkP:ap,atkA:Math.round(att),blk:bk,ace:ac,dig:dg,rcvG:rG,rcvT:rT,ast:as};
}
function playMatch(opp,k,oppName,label){
  const ro=role();
  const sh=ro.share;
  const p=winProb(effTeam(sh),opp,k);
  const win=R()<p;
  const mm=simStats(sh,S.season.st);
  recordSheet(makeSheet(win,oppName||'상대 팀',mm,label||curPhase().t));
  S.season.shareSum+=sh; S.season.shareN++;
  S.cond=clamp(S.cond-sh*3.2+ (sh===0?1.5:0),0,100);
  if(sh>0) for(const k2 of Object.keys(POS[S.pos].w).filter(isKey)) if(R()<.12) S.stats[k2]=clamp(r1(S.stats[k2]+0.2*trainFactor()),1,99);
  if(sh>0 && S.cond<25 && R()<0.03*(S.reinj?2:1)) injure(1,'체력이 바닥난 채 뛰다');
  return {win,p};
}

/* ---------- 구간 진행 ---------- */
function phaseAction(id){
  doAction(id);
  const ph=curPhase();
  // 랜덤 이벤트
  if(ph.k!=='awards' && R()<0.42){
    const ev=pickEvent();
    if(ev){ S.modal={type:'event',id:ev.id}; S.screen='event'; save(); render(); return; }
  }
  resolvePhase();
}
function resolvePhase(){
  const ph=curPhase();
  S.screen='phase';
  if(ph.k==='train'){ finishPhase([`${ph.t} 완료.`, S.lastMsg||''].filter(Boolean)); return; }
  if(ph.k==='league'){ runLeague(ph); return; }
  if(ph.k==='tour'||ph.k==='nat'||ph.k==='post'){ runTour(ph); return; }
}
function finishPhase(lines,extra){
  const ph=curPhase();
  let scene=null;
  if(ph.k==='train') scene={id:S.lastAct||'atk'};
  else if(ph.k==='nat') scene={id:'rally',win:!!ph._win};
  else if(ph.k==='post'&&!ph.rounds) scene=null;
  else scene={id: role().share>0?'rally':'bench', win:!!ph._win};
  const sheet = ph.k!=='train' ? (S.season.lastSheet||null) : null; S.season.lastSheet=null;
  S.modal={type:'report',lines,extra:extra||null,scene,sheet};
  S.screen='report';
  save(); render();
}
function nextPhase(){
  if(S.iv && S.iv.next!=='draft'){ S.modal=null; S.screen='interview'; save(); render(); return; }
  S.modal=null;
  S.season.idx++;
  if(S.injured>0 && !S.injDecision){ S.injured--; if(S.injured===0 && S.injury){ addLog(`💪 ${S.injury.name}에서 회복했다.`,'good'); S.injury=null; } }
  if(S.season.idx>=S.season.phases.length){ endSeason(); return; }
  const ph=curPhase();
  if(ph.k==='awards'){ doAwards(); return; }
  if(ph.k==='post'){ preparePost(ph); }
  refreshNews();
  S.screen='phase'; save(); render();
}

/* ---------- 리그 ---------- */
function ensureLeague(){
  if(S.season.league) return;
  const base = S.stage==='PRO'?72:(S.team.leagueBase||82);
  const names = S.stage==='PRO'? krTeams().map(t=>t.name).filter(n=>n!==S.team.name) : abroadOpp();
  S.season.league = names.map(n=>({name:n,rating:base+gauss()*3.5,w:0,l:0}));
}
function abroadOpp(){
  const L=ABROAD.find(a=>a.league===S.team.league);
  const extra=['리그 상위권 A','리그 상위권 B','중위권 C','중위권 D','중위권 E','하위권 F','하위권 G','하위권 H','하위권 I'];
  return [...L.teams[S.gender].filter(n=>n!==S.team.name),...extra].slice(0,9);
}
function runLeague(ph){
  ensureLeague();
  const L=S.season.league;
  let w=0,l=0,big=0;
  const s0={...S.season.st};
  for(let i=0;i<ph.n;i++){
    const opp=pick(L);
    const r=playMatch(opp.rating,undefined,opp.name,ph.t);
    if(r.win){w++;opp.l++;} else {l++;opp.w++;}
  }
  // 다른 팀끼리 경기 (대략)
  for(const t of L){
    const n=ph.n - Math.round(ph.n/L.length);
    for(let i=0;i<n;i++){ const p=clamp(0.5+(t.rating-avgRating(L))*0.035,0.08,0.92); if(R()<p)t.w++; else t.l++; }
  }
  S.season.w+=w; S.season.l+=l; ph._win = w>=l;
  const d=diffStats(s0,S.season.st);
  const lines=[`${ph.t}: ${w}승 ${l}패 (시즌 ${S.season.w}승 ${S.season.l}패)`];
  const ro=role();
  if(d.gp>0) lines.push(statLine(d));
  else lines.push(ro.r==='부상'?'부상으로 결장했다.':'출전 기회가 없었다. 웜업존에서 몸만 풀었다…');
  const rk=standing();
  lines.push(`현재 순위: ${rk.rank}위 / ${rk.n}팀`);
  if(ph.allstar){
    if(S.fame>=25 || (ro.r==='주전' && ovr()>=teamReq()+4)){ lines.push('⭐ 올스타전 팬 투표 선정!'); S.fame+=4; S.season.teamAwards.push('올스타 선정'); }
  }
  if(ph.last){ S.season.rank=rk.rank; }
  if(ro.r==='주전' && l>=w+3 && R()<.7) queueIv('slump',{l});
  finishPhase(lines);
}
function avgRating(L){ return L.reduce((a,t)=>a+t.rating,0)/L.length; }
function standing(){
  const L=S.season.league;
  const me={name:S.team.name,w:S.season.w,l:S.season.l,me:true};
  const all=[...L,me].sort((a,b)=>(b.w/(b.w+b.l||1))-(a.w/(a.w+a.l||1)));
  return {rank:all.indexOf(me)+1,n:all.length,table:all};
}
function diffStats(a,b){ const d={}; for(const k in b) d[k]=b[k]-a[k]; return d; }
function statLine(d){
  const p=S.pos;
  const parts=[`${d.gp}경기`];
  if(p==='S') parts.push(`세트 ${Math.round(d.ast)}`);
  if(p!=='L') parts.push(`${d.pts}득점`);
  if(p==='OH'||p==='OP'||p==='MB') parts.push(`공격성공률 ${d.atkA?Math.round(d.atkP/d.atkA*100):0}%`);
  if(p==='MB'||p==='OP') parts.push(`블로킹 ${d.blk}`);
  if(p!=='L'&&d.ace) parts.push(`서브 ${d.ace}`);
  if(p==='L'||p==='OH') parts.push(`리시브효율 ${d.rcvT?Math.round(d.rcvG/d.rcvT*100):0}%`);
  if(p==='L'||p==='S') parts.push(`디그 ${d.dig}`);
  return parts.join(' · ');
}

/* ---------- 토너먼트 (대회/대표팀/포스트시즌) ---------- */
function natStrength(){ return S.gender==='M'?70:73; }
function natRounds(comp){
  const b=natStrength();
  if(comp==='VNL') return [['예선 라운드',b+8+rnd(-2,2)],['8강',b+12],['4강',b+15],['결승',b+17]];
  if(comp==='올림픽') return [['조별리그',b+11],['8강',b+14],['4강',b+17],['결승',b+19]];
  if(comp==='아시안게임') return [['조별리그',b-2],['8강',b+3],['4강',b+8],['결승',b+12]];
  return [['조별리그',b+8],['16강',b+11],['8강',b+14],['4강',b+16],['결승',b+18]];
}
function natRole(){
  if(S.injured>0) return {r:'부상',share:0};
  const o=ovr();
  if(o>=82) return {r:'주전',share:1};
  if(o>=78) return {r:'교체',share:.5};
  return {r:'원포인트',share:.15};
}
function preparePost(ph){
  const rk=S.season.rank||standing().rank;
  const L=S.season.league;
  const tbl=standing().table.filter(t=>!t.me);
  const top=(tbl[0]||{rating:75}).rating||75;
  if(S.stage==='PRO'){
    if(rk===1) ph.rounds=[['챔피언결정전',(tbl[0].rating||74)+1]];
    else if(rk<=3) ph.rounds=[['플레이오프',(tbl[1]||tbl[0]).rating||73],['챔피언결정전',top+1]];
    else ph.rounds=null;
  }else{
    if(rk<=4) ph.rounds=[['준결승',top-1],['결승',top+1]];
    else ph.rounds=null;
  }
}
function runTour(ph){
  if(ph.k==='post' && !ph.rounds){
    finishPhase([`정규리그 ${S.season.rank}위로 시즌 마감. 봄배구 진출 실패…`]); return;
  }
  if(ph.k==='nat'){
    if(!ph.rounds) ph.rounds=natRounds(ph.comp);
    if(ph.qual && ph.qualified===undefined){
      const eff=natStrength()+natRole().share*(ovr()-natStrength())*0.45;
      ph.qualified = R()<clamp(0.25+(eff-72)*0.06,0.1,0.85);
      if(!ph.qualified){
        S.nat.caps+=3;
        finishPhase(['올림픽 최종예선에서 탈락… 본선 티켓을 놓쳤다.','4년 뒤를 기약한다.']); return;
      }
      addLog('🎉 올림픽 본선 진출 확정!','good');
    }
  }
  if(ph.ri===undefined){ ph.ri=0; ph.log=[]; ph.s0={...S.season.st}; }
  while(ph.ri<ph.rounds.length){
    const [rname,opp]=ph.rounds[ph.ri];
    const isFinal = ph.ri===ph.rounds.length-1;
    if(isFinal && !ph.clutchDone){
      const c=buildClutch(ph);
      if(c){ S.modal={type:'clutch',c}; S.screen='clutch'; save(); render(); return; }
    }
    const r=tourMatch(ph,opp,isFinal?ph.clutchBoost||0:0);
    ph.log.push(`${rname}: ${r.win?'승리 ✅':'패배 ❌'}`);
    if(!r.win){ ph.result=tourResult(ph,ph.ri,false); break; }
    ph.ri++;
    if(ph.ri>=ph.rounds.length){ ph.result=tourResult(ph,ph.ri,true); }
  }
  concludeTour(ph);
}
function tourMatch(ph,opp,boost){
  if(ph.k==='nat'){
    const ro=natRole();
    const eff=natStrength()+ro.share*(ovr()-natStrength())*0.45;
    const p=clamp(winProb(eff,opp,0.035)+boost,0.03,0.97);
    const tmp=blankStats(); const s=S.season.st;
    // 대표팀 기록은 소속팀 시즌 기록에 넣지 않음
    S.season.st=tmp; const mm=simStats(ro.share,tmp); S.season.st=s;
    ph.natSt=ph.natSt||blankStats(); for(const k in tmp) ph.natSt[k]+=tmp[k];
    S.cond=clamp(S.cond-ro.share*4,0,100);
    if(ro.share>0 && S.cond<30 && R()<0.06 && !S.injured){ injure(1,'대표팀 경기 중 무리하다'); ph.natHurt=true; }
    const wn=R()<p; recordSheet(makeSheet(wn,oppNameFor(ph),mm,`${ph.comp} ${ph.rounds[ph.ri][0]}`));
    return {win:wn};
  }
  const ro=role();
  const p=clamp(winProb(effTeam(ro.share),opp,S.stage==='HS'||S.stage==='UNI'?0.04:0.035)+boost,0.03,0.97);
  const mm=simStats(ro.share,S.season.st);
  S.season.shareSum+=ro.share*0.5; S.season.shareN+=0.5;
  const wn=R()<p; recordSheet(makeSheet(wn,oppNameFor(ph),mm,`${ph.t} ${ph.rounds[ph.ri][0]}`));
  return {win:wn};
}
function tourResult(ph,reached,champ){
  const n=ph.rounds.length;
  if(champ) return {label: ph.k==='nat'?'금메달':'우승',medal:'gold'};
  const lostAt=ph.rounds[reached][0];
  if(reached===n-1) return {label: ph.k==='nat'?'은메달':'준우승',medal:'silver'};
  if(lostAt==='4강'){
    if(ph.k==='nat'){ const ro=natRole(); const eff=natStrength()+ro.share*(ovr()-natStrength())*0.45;
      return R()<winProb(eff,ph.rounds[reached][1]-2) ? {label:'동메달',medal:'bronze'} : {label:'4위',medal:null}; }
    return {label:'4강',medal:null};
  }
  return {label: `${lostAt} 탈락`,medal:null};
}
function concludeTour(ph){
  const res=ph.result; ph._win = res.medal==='gold';
  const lines=[`${ph.t} — ${ph.log.join(' → ')}`,`최종 결과: ${res.label}`];
  if(ph.k==='nat'){
    S.nat.caps+=ph.rounds.length+2;
    (S.nat.results=S.nat.results||[]).push({y:S.year,comp:ph.comp,label:res.label});
    const ro=natRole();
    lines.push(`대표팀 역할: ${roleLabel(ro.r)}`);
    if(ph.natSt && ph.natSt.gp) lines.push('대표팀 기록: '+statLine(ph.natSt));
    const nx=S.season.phases[S.season.idx+1];
    if(!nx || nx.k!=='nat'){
      lines.push(`소속팀 복귀. 컨디션 ${Math.round(S.cond)}.`);
      if(S.stage!=='HS' && (S.cond<40 || ph.natHurt)){
        S.trust=clamp(S.trust-2,0,100);
        pushNews({h:`${S.team.name} 감독, "${S.name} 혹사 걱정된다"`,b:`대표팀 일정을 마치고 돌아온 ${S.name}의 몸 상태를 두고 소속팀이 우려를 나타냈다.`,hint:'대표팀 경기는 컨디션을 깎아요. 복귀 직후엔 휴식으로 컨디션을 먼저 올리세요.',tag:'차출'});
      }
    }
    if(res.medal){
      const ic={gold:'🥇',silver:'🥈',bronze:'🥉'}[res.medal];
      S.nat.medals.push({y:S.year,comp:ph.comp,label:res.label,ic});
      S.awards.push({y:S.year,t:`${ph.comp} ${res.label}`,ic,w:{gold:ph.comp==='올림픽'?40:ph.comp==='VNL'||ph.comp==='세계선수권'?25:12,silver:ph.comp==='올림픽'?25:12,bronze:ph.comp==='올림픽'?18:8}[res.medal]});
      S.fame+= {gold:15,silver:9,bronze:7}[res.medal]*(ph.comp==='올림픽'?2:1);
      addLog(`${ic} ${ph.comp} ${res.label}!`,'good');
      if(ph.comp==='아시안게임' && res.medal==='gold' && S.gender==='M') { lines.push('🎖️ 아시안게임 금메달로 병역 특례 혜택!'); }
    }
    if(res.medal==='gold' && ro.r==='주전' && R()<0.45+ (ph.clutchWin?0.3:0)){
      lines.push(`🏅 ${ph.comp} 대회 MVP 수상!`); S.awards.push({y:S.year,t:`${ph.comp} MVP`,ic:'🏅',w:ph.comp==='올림픽'?30:15}); S.fame+=10;
    }else if(ro.r==='주전' && ovr()>=86 && R()<0.35){
      lines.push(`🌟 ${ph.comp} 드림팀(베스트 포지션) 선정`); S.awards.push({y:S.year,t:`${ph.comp} 베스트 ${POS[S.pos].s}`,ic:'🌟',w:8}); S.fame+=4;
    }
  }else{
    const d=diffStats(ph.s0,S.season.st);
    if(d.gp>0) lines.push('대회 기록: '+statLine(d)); else lines.push('대회 내내 웜업존을 지켰다.');
    if(res.medal==='gold'){
      const t = ph.k==='post' ? (S.stage==='PRO'?'V리그 챔피언':`${S.team.league} 우승`) : `${ph.cup} 우승`;
      S.season.teamAwards.push(t);
      S.awards.push({y:S.year,t,ic:'🏆',w: ph.k==='post'? (S.stage==='PRO'?20:28) : S.stage==='PRO'?6:4});
      S.fame+= ph.k==='post'?10:3;
      addLog(`🏆 ${t}!`,'good');
      if(ph.k==='post') S.season.champion=true;
      const ro=role();
      if(ro.r==='주전' && R() < (ph.k==='post'?0.35:0.3)+(ph.clutchWin?0.35:0)){
        const mt = ph.k==='post' ? (S.stage==='PRO'?'챔피언결정전 MVP':`${S.team.league} 플레이오프 MVP`) : `${ph.cup} MVP`;
        lines.push(`🏅 ${mt} 수상!`); S.awards.push({y:S.year,t:mt,ic:'🏅',w:ph.k==='post'?18:3}); S.fame+= ph.k==='post'?8:2;
        if(ph.k==='post') S.season.finalsMVP=true;
      }
    }else if(res.medal==='silver' && ph.k==='post'){ S.season.teamAwards.push('준우승'); }
  }
  const ro2 = ph.k==='nat'?natRole():role();
  if(ro2.share>0){
    const title = ph.k==='nat'?`${ph.comp} ${res.label}`: ph.k==='post'?(S.stage==='PRO'?'V리그 챔피언결정전':`${S.team.league} 플레이오프`):`${ph.cup}`;
    if(res.medal==='gold' || (ph.k==='nat'&&res.medal)) queueIv('win',{title: ph.k==='nat'?title:`${title} 우승`});
    else if(res.medal==='silver' && ph.k!=='nat') queueIv('lose',{title});
  }
  finishPhase(lines);
}

/* ---------- 대표팀 차출 ---------- */
function callupInfo(){
  const ph=curPhase(); const o=ovr();
  return {comps:ph.comps, role: o>=82?'주전':o>=78?'로테이션':'엔트리 막내', captain: !S.nat.captain && S.nat.caps>=35 && o>=84, canRetire: S.age>=32 && S.nat.caps>0};
}
function callupChoice(c){
  const ph=curPhase(); const info=callupInfo();
  const dropNat=()=>{ const P=S.season.phases; while(P[S.season.idx+1] && P[S.season.idx+1].k==='nat') P.splice(S.season.idx+1,1); };
  const what=info.comps.join('·');
  if(c==='accept'){
    S.nat.called=(S.nat.called||0)+1; S.fame+=2;
    if(info.captain){ S.nat.captain=true; S.fame+=5; S.awards.push({y:S.year,t:'국가대표 주장 선임',ic:'🎗️',w:6}); addLog('🎗️ 국가대표 주장으로 선임됐다!','good'); }
    pushNews({h: info.captain?`${S.name}, 대표팀 새 주장으로`:`${S.name}, ${what} 대표팀 승선`, b:`대표팀 코칭스태프는 ${S.name}을(를) ${info.captain?'주장으로 선임했다':info.role+' 자원으로 분류했다'}.`, hint:'대표팀 경기는 컨디션을 깎아요. 복귀 후 소속팀 일정을 위해 체력을 아껴 두세요.', tag:'차출'});
    if(S.stage==='PRO' && S.season && R()<.35){ S.trust=clamp(S.trust-2,0,100); addLog(`📞 ${S.team.name} 감독: "몸 상하지 않게만 하고 와라."`,''); }
    addLog(`🇰🇷 ${what} 대표팀 소집에 응했다.`,'hi');
  }else if(c==='decline'){
    dropNat(); S.cond=clamp(S.cond+25,0,100); S.fame=Math.max(0,S.fame-6); S.trust=clamp(S.trust+3,0,100);
    const ban = ovr()>=80;
    if(ban) S.nat.ban=S.year+1;
    pushNews({h:`${S.name}, 대표팀 소집 고사… 차출 거부 논란`, b:`몸 관리를 이유로 ${what} 대표팀 소집을 고사했다. 팬들 사이에서 찬반이 엇갈린다.`, hint: ban?'핵심 선수가 소집을 고사하면 다음 해 대표팀 명단에서 빠질 수 있어요.':'이번엔 큰 문제 없이 넘어갔어요. 컨디션 +25, 소속팀 신뢰 +3.', tag:'차출'});
    addLog(`🙅 ${what} 대표팀 소집을 고사했다. 컨디션 +25, 인기 -6.`,'bad');
  }else if(c==='retire'){
    dropNat(); S.nat.retired=true; S.fame+=3; S.cond=clamp(S.cond+20,0,100);
    pushNews({h:`${S.name}, 태극마크 반납… 대표팀 은퇴 선언`, b:`대표팀 ${S.nat.caps}경기 출전 기록을 남기고 후배들에게 자리를 넘긴다.`, tag:'차출'});
    addLog(`🇰🇷 대표팀 은퇴를 선언했다. (A매치 ${S.nat.caps}경기)`,'hi');
  }
  nextPhase();
}

      {t:'투 어택 직접 공격',d:'모두의 예상을 깬다',k:['men','atk'],b:.33,amp:1.35}]},

function clutchChance(o){
  const v=o.k.reduce((a,k)=>a+S.stats[k],0)/o.k.length;
  const ref = S.season && curPhase().k==='nat'?80:stageAvg();
  const lefty = S.hand==='L' && /크로스|투 어택|손끝|밀어/.test(o.t) ? 0.06 : 0;
  return clamp(o.b+(v-ref)*0.012+(S.cond-60)*0.001+lefty,0.08,0.93);
}
function chooseClutch(i){
  const ph=curPhase(); const c=S.modal.c; const o=c.opts[i];
  const p=clutchChance(o);
  const ok=R()<p;
  S.clutch.t++; if(ok){S.clutch.w++; ph.clutchWin=true;}
  ph.clutchDone=true;
  ph.clutchBoost = ok? 0.3*o.amp : -0.22*o.amp;
  const txt = ok ? pick(['완벽했다! 체육관이 폭발한다!','성공! 벤치가 모두 뛰쳐나온다!','결정타! 상대가 고개를 떨군다.']) : pick(['막혔다… 흐름이 넘어간다.','범실. 머리가 하얘진다.','아쉽다! 한 뼘 차이로 빗나갔다.']);
  addLog(`⚡ 결정적 순간 [${o.t}] — ${txt}`, ok?'good':'bad');
  if(ok){ S.fame+=2; S.stats.men=clamp(r1(S.stats.men+0.6),1,99); }
  S.modal={type:'clutchResult',ok,txt,o,p};
  S.screen='clutchResult';
  save(); render();
}

    c:[{t:'계약한다',f:()=>{S.agent=true;S.fame+=2;return '해외 진출 제안 확률 상승';}},

    c:[{t:'이적을 요청한다',f:()=>{const t=pick(krTeams().filter(x=>x.name!==S.team.name));S.team=teamFrom(t,clamp(S.team.rating-ri(3,6),62,80));S.trust=52;S.season.league=null;ensureLeague();return `${t.name}로 이적! 새 출발.`;}},
       {t:'남아서 경쟁한다',f:()=>{S.trust+=4;return '감독 신뢰 +4';}}]},

function pickKey(){ const ks=Object.keys(POS[S.pos].w).filter(isKey); return pick(ks); }
function pickEvent(){
  const pool=EVENTS.map(e=>({e,w:e.w()})).filter(x=>x.w>0);
  const tot=pool.reduce((a,x)=>a+x.w,0); let r=R()*tot;
  for(const x of pool){ r-=x.w; if(r<=0) return x.e; }
  return null;
}
function chooseEvent(i){
  const ev=EVENTS.find(e=>e.id===S.modal.id);
  const res=ev.c[i].f();
  S.cond=clamp(S.cond,0,100); S.trust=clamp(S.trust,0,100);
  addLog(`📩 ${ev.t} → ${ev.c[i].t}: ${res}`,'hi');
  S.modal=null;
  resolvePhase();
}

/* ---------- 시상 ---------- */
function seasonPerf(){
  const sh=S.season.shareN?S.season.shareSum/S.season.shareN:0;
  return ovr() + (sh-1)*28 + (S.season.champion?3:0) + (S.season.rank&&S.season.rank<=2?2:0) + gauss()*2.2;
}
function doAwards(){
  const perf=seasonPerf();
  const sh=S.season.shareN?S.season.shareSum/S.season.shareN:0;
  const lines=[];
  const add=(t,ic,w,f)=>{S.awards.push({y:S.year,t,ic,w});lines.push(`${ic} ${t}`);S.fame+=f||0;addLog(`${ic} ${t} 수상!`,'good');};
  const st=S.stage;
  if(st==='HS'||st==='UNI'){
    if(perf>=(st==='HS'?54:61) && sh>=.8) add(st==='HS'?'고교 최우수 선수':(S.team.league==='실업'?'실업 최우수 선수':'대학 최우수 선수'),'🎖️',st==='HS'?3:4,3);
    if(st==='HS' && S.grade===3 && perf>=56 && sh>=.8) add('U19 청소년 대표 발탁','🇰🇷',3,3);
  }else if(st==='PRO'){
    if(S.rookieSeason && sh>=.12 && ovr()>=57 && R()<.65) add('V리그 신인선수상','🌱',8,5);
    if(perf>=80 && sh>=.8){
      add(`V리그 베스트7 (${POS[S.pos].s})`,'⭐',6,4);
    }
    if(perf>=85 && sh>=.9 && (S.season.rank<=2 || perf>=90)) add('V리그 정규리그 MVP','👑',25,12);
    if(perf>=82 && sh>=.9){
      const pa={OH:'득점상',OP:'득점상',MB:'블로킹상',S:'세트상',L:'수비상'}[S.pos];
      if(R()<.55) add(`V리그 ${pa}`,'🎯',5,2);
    }
  }else{
    if(perf>=86 && sh>=.8) add(`${S.team.league} 베스트 ${POS[S.pos].s}`,'⭐',9,5);
    if(perf>=90 && sh>=.9 && (S.season.rank<=2||perf>=93)) add(`${S.team.league} MVP`,'👑',30,15);
  }
  // 올해의 세계 배구선수
  if(st==='PRO'||st==='ABROAD'){
    const hasBig = S.awards.some(a=>a.y===S.year && /MVP|금메달|우승|챔피언/.test(a.t));
    const score = ovr() + (st==='ABROAD'?2:-2) + (hasBig?3:0) + S.nat.medals.filter(m=>m.y===S.year).length*2 + gauss()*1.5;
    if(score>=96 && sh>=.9){ add('올해의 세계 배구선수 (World MVP)','🌍',60,25); S.worldMVP=(S.worldMVP||0)+1; }
  }
  const sm=S.season.st;
  const row={year:S.year,label:seasonLabel(),age:S.age,team:S.team.name,league:S.stage==='HS'?'고교':S.stage==='UNI'?'대학':S.stage==='PRO'?'V리그':S.team.league,
    role:roleFromShare(sh),gp:sm.gp,pts:sm.pts,blk:sm.blk,ace:sm.ace,dig:sm.dig,ast:Math.round(sm.ast),
    atk:sm.atkA?Math.round(sm.atkP/sm.atkA*1000)/10:null,rcv:sm.rcvT?Math.round(sm.rcvG/sm.rcvT*1000)/10:null,
    sets:Math.round(sm.sets),rcvG:sm.rcvG,rcvT:sm.rcvT,w:S.season.w,l:S.season.l,rank:S.season.rank,ovr:ovr(),team_aw:[...S.season.teamAwards],
    aw:S.awards.filter(a=>a.y===S.year).map(a=>a.ic+' '+a.t)};
  S.history.push(row);
  if(S.stage==='PRO'){ const v=S.vl||(S.vl={pts:0,blk:0,dig:0,gp:0,seasons:0}); v.pts+=sm.pts; v.blk+=sm.blk; v.dig+=sm.dig; v.gp+=sm.gp; v.seasons++; }
  S.career.pts+=sm.pts; S.career.blk+=sm.blk; S.career.ace+=sm.ace; S.career.dig+=sm.dig; S.career.ast+=Math.round(sm.ast); S.career.gp+=sm.gp;
  const big=S.awards.filter(a=>a.y===S.year && /MVP|신인|베스트|최우수|올해의/.test(a.t)).sort((a,b)=>(b.w||0)-(a.w||0))[0];
  if(big) queueIv('award',{title:big.t});
  if(!lines.length) lines.push('개인 수상은 없었다. 다음 시즌을 기약한다.');
  S.modal={type:'awards',lines,row};
  S.screen='awards'; save(); render();
}
function roleFromShare(sh){ return sh>=.8?'주전':sh>=.4?'교체':sh>=.08?'원포인트':'웜업존'; }

/* ---------- 시즌 종료 / 오프시즌 ---------- */
function endSeason(){
  // 성장/노화
  const a=S.age;
  const rate = a<=17?.075:a<=20?.09:a<=23?.08:a<=26?.05:a<=28?.02:0;
  const phys=['jmp','sta','atk','blk'];
  const ch=[];
  for(const k in S.stats){
    let s=S.stats[k];
    if(rate>0) s+=Math.max(0,S.cap[k]-s)*rate*rnd(.8,1.2);
    if(a>=30){ const dec=(a-29)*(phys.includes(k)?.7:.3)*rnd(.6,1.3); s-=dec; if(k==='men') s+=1; }
    S.stats[k]=clamp(r1(s),1,99);
  }
  rivalSeason();
  S.age++; S.year++;
  S.cond=clamp(S.cond+45,0,100);
  S.injured=0; S.injury=null; S.injDecision=false; if(S.reinj) S.reinj--;
  S.trust=clamp(S.trust*0.7+15,0,100);
  S.rookieSeason=false;
  const o=ovr();
  addLog(`— ${S.age}세, 새 시즌. 종합 능력치 ${o} —`,'hi');
  // 진로
  if(S.stage==='HS'){
    if(S.grade<3){ S.grade++; startSeason(); render(); return; }
    return runDraft('HS');
  }
  if(S.stage==='UNI'){
    if(S.grade<2){ S.grade++; startSeason(); render(); return; }
    return runDraft('UNI');
  }
  // 프로/해외: 연봉 & 오프시즌 선택
  updateSalary();
  if(S.age>=39){ return endCareer('나이의 벽. 정든 코트를 떠난다.'); }
  if(underContract()){
    const abroad=[];
    if(S.stage==='PRO' && S.age<=33) for(const L of ABROAD){ if(o>=L.need && R()<(S.agent?.6:.35)) abroad.push(L.league); }
    S.modal={type:'offseason',fa:false,left:S.contractEnd-S.year,offers:abroad,canRetire:S.age>=33};
  }else{
    S.modal={type:'offseason',fa:true,offers:buildOffers(),canRetire:S.age>=33};
  }
  S.screen='offseason'; save(); render();
}
function updateSalary(){
  const o=ovr();
  let base=Math.max(0.5,(o-55)*0.32+S.fame*0.02);
  if(S.stage==='ABROAD'){ const L=ABROAD.find(a=>a.league===S.team.league); base*= (L?L.mult:1.5); }
  S.salary=r1(base);
}
function offseasonChoice(kind,arg){
  if(kind==='retire') return endCareer('스스로 은퇴를 결정했다. 박수 칠 때 떠난다.');
  if(kind==='stay' && underContract()){ addLog(`${S.team.name}에서 계약 기간을 이어 간다.`,''); S.modal=null; startSeason(); render(); return; }
  if(kind==='stay'){
    openContract('재계약', S.team);
  }else if(kind==='abroad'){
    const L=ABROAD.find(a=>a.league===arg); const t=abroadTeam(L);
    const team={name:t.name,e:t.e,color:t.color,rating:L.base+ri(-3,2),league:L.league,leagueBase:L.base};
    openContract('해외 이적', team, {stage:'ABROAD',trust:48,fame:6});
  }else if(kind==='home'){
    const t=pick(krTeams());
    openContract('V리그 복귀', teamFrom(t,clamp(72+ri(-2,5),64,80)), {stage:'PRO',trust:60});
  }
}
/* ---------- 계약 ---------- */
function salaryFor(team,stage){
  const o=ovr(); let base=Math.max(0.5,(o-55)*0.32+S.fame*0.02);
  if(stage==='ABROAD'){ const L=ABROAD.find(a=>a.league===team.league); base*=(L?L.mult:1.5); }
  return r1(base);
}
function openContract(kind,team,apply){
  apply=apply||{};
  const stage=apply.stage||S.stage;
  let sal = apply.salary!=null ? apply.salary : salaryFor(team,stage);
  const years = apply.years || (kind==='신인 계약'?3: S.age>=33?1: ovr()>=82?3:2);
  S.pending={kind,team,apply,salary:sal,years,y:S.year};
  S.modal={type:'contract'}; S.screen='contract'; save(); render();
}
function signContract(sig){
  const c=S.pending; if(!c) return;
  if(c.apply.stage){ if(c.apply.stage!==S.stage) S.grade=0; S.stage=c.apply.stage; }
  S.team=c.team;
  if(c.apply.trust!=null) S.trust=c.apply.trust;
  if(c.apply.fame) S.fame+=c.apply.fame;
  S.salary=c.salary; S.contractEnd=c.y+c.years;
  S.contracts=S.contracts||[];
  S.contracts.forEach(x=>{ if(x.sig && S.contracts.indexOf(x)<S.contracts.length-2) x.sig=null; });
  S.contracts.push({y:c.y,kind:c.kind,team:c.team.name,salary:c.salary,years:c.years,sig:sig||null});
  const ic = c.kind==='해외 이적'?'✈️':c.kind==='V리그 복귀'?'🏠':'✍️';
  addLog(`${ic} ${c.team.name}와 ${c.kind} 서명. ${c.years}년, 연봉 ${c.salary}억 원.`, c.kind==='재계약'?'':'good');
  if(c.kind==='해외 이적') queueIv('abroad',{league:c.team.league});
  S.pending=null; S.modal=null;
  startSeason(); render();
}
function runDraft(from){
  const o=ovr();
  const hsBonus = S.awards.filter(a=>a.y>=S.year-3 && /우승|최우수|청소년/.test(a.t)).length*1.2;
  const score = o + hsBonus + gauss()*2 + (from==='UNI'?-1:0) + (S.hand==='L'&&(S.pos==='OP'||S.pos==='OH')?1.5:0);
  let pick_,rd;
  if(score>=64){rd=1;pick_=ri(1,2);}
  else if(score>=60){rd=1;pick_=ri(3,7);}
  else if(score>=55){rd=2;pick_=ri(1,7);}
  else if(score>=51){rd=3;pick_=ri(1,7);}
  else {rd=0;}
  if(rd===0){
    S.modal={type:'draft',fail:true,from};
    S.screen='draft'; save(); render(); return;
  }
  const idx = rd===1 ? clamp(pick_-1,0,6) : ri(0,6);
  const t = krTeams()[idx];
  const rating = rd===1 ? 66+pick_*0.9+rnd(-1.5,1.5) : 70+rnd(-2,4);
  S.draftInfo={rd,pick:pick_,team:t.name,from};
  S.draftTeam=teamFrom(t,rating);
  S.draftTrust=rd===1?52:44;
  S.draftSalary=rd===1?(pick_<=2?1.5:1.0):0.6;
  S.fame+= rd===1?6:2;
  addLog(`📋 신인 드래프트 ${rd}라운드 ${pick_}순위 — ${t.name} 지명!`,'good');
  queueIv('draft',{team:t.name,legend:legendFor()},'draft');
  S.modal={type:'draft',fail:false,rd,pick:pick_,team:t.name};
  S.screen='draft'; save(); render();
}
function acceptDraft(){
  S.rookieSeason=true;
  openContract('신인 계약', S.draftTeam, {stage:'PRO',trust:S.draftTrust,salary:S.draftSalary});
}
function draftFailChoice(c){
  if(c==='uni'){
    S.stage='UNI'; S.grade=1;
    S.team = S.gender==='M' ? {name:pick(['경기대','인하대','성균관대','한양대','중부대']),e:'',rating:50,color:'#0F766E',league:'대학'} : {name:'수원시청',e:'수원',rating:50,color:'#0F766E',league:'실업'};
    S.team.e=S.team.name.slice(0,2);
    S.trust=48; addLog(S.team.league==='대학'?`🎓 ${S.team.name} 배구부 진학. 2년 뒤 드래프트에 재도전한다.`:`🏢 실업팀 ${S.team.name} 입단. 2년 뒤 드래프트에 재도전한다.`,'hi');
    startSeason(); render();
  }else{
    endCareer('프로의 꿈을 접고 실업팀에서 배구를 이어가기로 했다.');
  }
}

/* ---------- 커리어 종료 ---------- */
function careerScore(){ return Math.round(S.awards.reduce((a,x)=>a+(x.w||0),0) + S.career.pts/80 + S.nat.caps*0.3 + Math.max(...S.history.map(h=>h.ovr),0)*0.5); }
function grade(sc){ return sc>=420?'레전드':sc>=260?'S':sc>=160?'A':sc>=90?'B':sc>=55?'C':'D'; }
function endCareer(msg){
  S.stage='RETIRED'; S.retireMsg=msg;
  const sc=careerScore();
  S.final={score:sc,grade:grade(sc)};
  addLog(`🎬 ${msg}`,'hi');
  try{
    const h=JSON.parse(localStorage.getItem(HOF_KEY)||'[]');
    S.hofD=Date.now(); h.push({name:S.name,pos:S.pos,gender:S.gender,score:sc,grade:S.final.grade,peak:Math.max(...S.history.map(x=>x.ovr),ovr()),
      mvp:S.awards.filter(a=>/MVP/.test(a.t)).length,world:S.worldMVP||0,gold:S.nat.medals.filter(m=>m.ic==='🥇').length,end:S.age,d:S.hofD});
    h.sort((a,b)=>b.score-a.score); localStorage.setItem(HOF_KEY,JSON.stringify(h.slice(0,30)));
  }catch(e){}
  S.screen='end'; save(); render();
}

function myMetric(k){
  const vl=S.vl||{pts:0,blk:0,dig:0,gp:0,seasons:0};
  const cnt=t=>S.awards.filter(a=>a.t===t).length;
  const vrows=S.history.filter(h=>h.league==='V리그'&&h.sets>0&&h.gp>=8);
  switch(k){
    case 'mvp': return cnt('V리그 정규리그 MVP');
    case 'fmvp': return cnt('챔피언결정전 MVP');
    case 'champ': return cnt('V리그 챔피언');
    case 'olym4': return (S.nat.results||[]).filter(r=>r.comp==='올림픽'&&/금|은|동|4위/.test(r.label)).length;
    case 'abroad': return S.history.some(h=>!['고교','대학','실업','V리그'].includes(h.league))?1:0;
    case 's_mvp': return S.pos==='S'&&cnt('V리그 정규리그 MVP')>0?1:0;
    case 'pts': return vl.pts; case 'blk': return vl.blk; case 'dig': return vl.dig; case 'gp': return vl.gp; case 'seasons': return vl.seasons;
    case 'digps': return vrows.reduce((m,h)=>Math.max(m,h.dig/h.sets),0);
    case 'rcvbest': return vrows.filter(h=>h.rcvT>=60).reduce((m,h)=>Math.max(m,h.rcvG/h.rcvT*100),0);
  }
  return 0;
}

function bindContract(){
  const cv=document.getElementById('sig'); if(!cv) return;
  const box=cv.getBoundingClientRect(); const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=Math.max(200,Math.round(box.width||280)), h=110;
  cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+'px';
  const c=cv.getContext('2d'); c.scale(dpr,dpr);
  c.lineCap='round'; c.lineJoin='round'; c.strokeStyle='#0F1B33'; c.lineWidth=2.4;
  let drawing=false, last=null, ink=0;
  const done=document.getElementById('sigDone'), hint=document.getElementById('sigHint');
  const pt=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
  cv.addEventListener('pointerdown',e=>{ drawing=true; last=pt(e); cv.setPointerCapture(e.pointerId); hint.style.opacity=0; e.preventDefault(); });
  cv.addEventListener('pointermove',e=>{ if(!drawing) return; const p=pt(e); c.beginPath(); c.moveTo(last[0],last[1]); c.lineTo(p[0],p[1]); c.stroke(); ink+=Math.hypot(p[0]-last[0],p[1]-last[1]); last=p; if(ink>40) done.disabled=false; e.preventDefault(); });
  const up=()=>{ drawing=false; };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  document.getElementById('sigClear').onclick=()=>{ c.clearRect(0,0,w,h); ink=0; done.disabled=true; hint.style.opacity=1; };
  done.onclick=()=>{
    let data=null; try{ data=cv.toDataURL('image/png'); }catch(e){}
    document.getElementById('contract').classList.add('signed');
    done.disabled=true;
    setTimeout(()=>signContract(data), window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches?0:900);
  };
}

function legendFor(){ const same=LEGENDS.filter(l=>l.pos===S.pos&&l.g===S.gender); const L=same[0]||LEGENDS.find(l=>l.pos===S.pos)||LEGENDS[0]; return L.name; }

function pushNews(n){ S.newsArc=S.newsArc||[]; S.newsArc.unshift({...n,y:S.year,fresh:true}); if(S.newsArc.length>30) S.newsArc.pop(); }
function genNews(){
  if(!S || S.stage==='RETIRED' || !S.season) return [];
  const o=ovr(), ro=role(), ph=curPhase();
  const keys=Object.keys(POS[S.pos].w).filter(isKey).sort((a,b)=>POS[S.pos].w[b]-POS[S.pos].w[a]);
  const urgent=[], hints=[];
  if(S.injured>0) urgent.push({h:`${S.name}, 재활 순조… 복귀 시점은?`,b:'트레이너는 서두른 복귀가 재부상으로 이어질 수 있다고 경고했다.',hint:'부상 중에는 재활만 할 수 있어요. 구간이 하나 지날 때마다 회복돼요.'});
  else if(S.cond<40) urgent.push({h:'강행군 이어지며 부상 경계령',b:`${S.team.name} 의무 트레이너는 "지친 몸으로 뛰면 다친다"며 휴식을 권했다.`,hint:'컨디션이 낮을수록 경기력이 떨어지고 부상 위험이 커져요. 휴식은 컨디션 +38.'});
  if(ro.r!=='주전' && ro.r!=='부상' && ph.k!=='nat'){
    const d=Math.max(1,Math.ceil(teamReq()-(o+(S.trust-50)*.1)));
    hints.push({h:`[분석] ${S.team.name} ${POS[S.pos].n} 주전 경쟁, 열쇠는 '${STATS[keys[0]]}'`,b:`코칭스태프가 ${keys.slice(0,2).map(k=>STATS[k]).join('과 ')}을 가장 중요하게 본다는 후문이다.`,hint:`주전까지 능력치와 감독 신뢰 합계로 약 ${d} 남았어요.`});
  }
  if(S.trust<42) hints.push({h:'감독 "훈련 태도 보고 기회 준다"',b:'경기 영상을 먼저 챙겨 보는 선수가 눈에 띈다는 말도 덧붙였다.',hint:'영상 분석은 감독 신뢰 +4. 휴식만 하면 신뢰가 조금 떨어져요.'});
  if(S.stage==='HS' && S.grade===3){
    const est=o>=64?'1라운드 상위 순번':o>=60?'1라운드':o>=55?'2라운드':o>=51?'3라운드':'지명권 밖';
    hints.push({h:'올해 신인 드래프트 유망주 랭킹 공개',b:`${S.hs}의 ${S.name}은(는) 스카우트들 사이에서 '${est}' 평가를 받았다.`,hint:'드래프트 순번은 시즌이 끝날 때의 종합 능력치와 고교 수상으로 정해져요. 종합 60 이상이면 1라운드권.'});
  }
  if(S.stage!=='HS' && S.age>=18 && o>=66 && o<73) hints.push({h:'대표팀, 세대교체 위해 젊은 피 찾는다',b:'대표팀 코칭스태프가 리그 경기장을 돌며 새 얼굴을 살피고 있다.',hint:'시즌이 끝날 때 종합 73 이상이면 다음 여름 대표팀에 뽑혀요.'});
  if(S.stage==='PRO' && o>=74 && o<78) hints.push({h:'해외 구단들, 한국 선수에 관심',b:`일본과 유럽 에이전트들이 V리그 경기장을 찾고 있다는 소식이다.`,hint:'종합 78이면 일본, 83 튀르키예, 85 폴란드, 87 이탈리아 리그 제안이 올 수 있어요.'});
  if((S.year+1)%4===0 && S.stage!=='HS' && S.age>=18) hints.push({h:'내년은 올림픽의 해… 본선 티켓이 1차 목표',b:'대표팀은 예선 통과를 위해 핵심 선수들의 성장에 기대를 걸고 있다.',hint:'올림픽은 예선을 통과해야 나갈 수 있어요. 대표팀 전력은 주전 선수의 능력치로 올라가요.'});
  if(S.age>=29) hints.push({h:'베테랑의 숙제, 점프력 관리',b:'서른을 넘기면 몸이 먼저 신호를 보낸다는 게 선배들의 공통된 말이다.',hint:'30세부터 점프력·체력·공격·블로킹이 조금씩 떨어지고, 배구 IQ는 오히려 올라요.'});
  if(ph.k==='league' && S.season.w+S.season.l>0){ const st=standing(); hints.push({h:`${S.team.name}, 현재 ${st.rank}위`,b:`${S.season.w}승 ${S.season.l}패. 순위 싸움이 본격적으로 달아오르고 있다.`,hint:S.stage==='PRO'?'정규리그 3위 안에 들어야 봄배구에 나가요. 1위는 챔프전 직행.':'정규리그 4위 안에 들어야 플레이오프에 나가요.'}); }
  if(ph.k==='callup') urgent.push({h:'대표팀 최종 명단 발표 임박',b:`${ph.comps.join('·')}에 나설 엔트리가 곧 공개된다.`,hint:'소집에 응하면 국제대회 경험과 인기를 얻지만 컨디션이 깎여요. 고사하면 쉴 수 있지만 다음 해 명단에서 빠질 수 있어요.'});
  if(ph.k==='tour'||ph.k==='post'||ph.k==='nat') hints.push({h:`${ph.t} 개막 임박`,b:'결승까지 가면 경기를 가르는 한 점이 기다린다.',hint:'결승에서는 결정적 순간을 직접 골라요. 관련 능력치와 컨디션이 성공률을 정해요.'});
  const out=[];
  if(urgent.length) out.push(urgent[0]); else if(hints.length) out.push(pick(hints));
  const fresh=(S.newsArc||[]).find(n=>n.fresh);
  if(fresh){ fresh.fresh=false; out.push(fresh); }
  else out.push(flavorNews());
  return out;
}
function flavorNews(){

/* =========================================================
   경기 기록지 · 감독과의 대화 · 라이벌 · FA 시장 · 부상 종류 · 공유 카드
   ========================================================= */

/* ---------- 경기 기록지 ---------- */
const NATIONS = ['일본','중국','태국','이란','브라질','폴란드','이탈리아','미국','튀르키예','프랑스','세르비아','네덜란드'];
function oppNameFor(ph,rname){
  if(ph.k==='nat') return pick(NATIONS);
  if(S.stage==='HS'){ const pool=schools(S.gender).map(s=>s.name).filter(n=>n!==S.team.name); return pick(pool); }
  if(S.stage==='UNI') return S.team.league==='실업'?pick(['화성시청','양산시청','대구시청','포항시체육회']):pick(['경기대','인하대','성균관대','한양대','중부대','홍익대'].filter(n=>n!==S.team.name));
  if(S.stage==='PRO') return pick(krTeams().map(t=>t.name).filter(n=>n!==S.team.name));
  const L=ABROAD.find(a=>a.league===S.team.league); return L?pick(L.teams[S.gender].filter(n=>n!==S.team.name).concat(['리그 상위권 팀'])):'상대 팀';
}
function setScores(win){
  const l=pick([0,0,1,1,2]);
  const seq=[...Array(2).fill('W'),...Array(l).fill('L')].sort(()=>R()-.5); seq.push('W');
  return seq.map((x,i)=>{
    const to=i===4?15:25, deuce=R()<.17;
    const hi=deuce?to+ri(1,4):to, lo=deuce?hi-2:ri(i===4?8:14,to-2);
    const usWon = win?(x==='W'):(x!=='W');
    return usWon?[hi,lo]:[lo,hi];
  });
}
function makeSheet(win,opp,m,label){
  const sets=setScores(win);
  const us=sets.reduce((a,s)=>a+s[0],0), them=sets.reduce((a,s)=>a+s[1],0);
  const split=(t)=>{ const atk=Math.round(t*rnd(.52,.6)), blk=Math.round(t*rnd(.08,.13)), ace=Math.round(t*rnd(.03,.07)); return {atk,blk,ace,err:Math.max(0,t-atk-blk-ace)}; };
  const U=split(us), T=split(them);
  if(m){ U.atk=Math.max(U.atk,m.atkP); U.blk=Math.max(U.blk,m.blk); U.ace=Math.max(U.ace,m.ace); U.err=Math.max(0,us-U.atk-U.blk-U.ace); }
  const mine = m ? {sets:Math.min(sets.length,Math.max(1,Math.round(m.sets))),pts:m.pts,atkP:m.atkP,atkA:m.atkA,blk:m.blk,ace:m.ace,dig:m.dig,rcvG:m.rcvG,rcvT:m.rcvT,ast:Math.round(m.ast)} : null;
  const star = !!(m && win && (m.pts>=Math.max(14,us*.2) || (S.pos==='L'&&m.dig>=12) || (S.pos==='S'&&m.ast>=40)));
  return {y:S.year,label,opp,win,sets,U,T,mine,star,team:S.team.name};
}
function recordSheet(sh){
  S.season.lastSheet=sh;
  S.sheets=S.sheets||[]; S.sheets.unshift(sh); if(S.sheets.length>12) S.sheets.pop();
}
function sheetHTML(sh,open){
  if(!sh) return '';
  const n=sh.sets.length;
  const won=sh.sets.filter(s=>s[0]>s[1]).length, lost=n-won;
  const cols=[0,1,2,3,4].map(i=>sh.sets[i]);
  const m=sh.mine;
  const myRow = m ? (()=>{
    const cells=[['세트',m.sets]];
    if(S.pos!=='L') cells.push(['득점',m.pts]);
    if(S.pos==='OH'||S.pos==='OP'||S.pos==='MB') cells.push(['공격',`${m.atkP}/${m.atkA}`]);
    if(S.pos!=='L') cells.push(['블로킹',m.blk],['서브',m.ace]);
    if(S.pos==='S') cells.push(['세트 성공',m.ast]);
    if(S.pos==='L'||S.pos==='OH') cells.push(['리시브',m.rcvT?`${m.rcvG}/${m.rcvT}`:'-']);
    cells.push(['디그',m.dig]);
    return `<div class="ss-me"><p class="ss-cap">${esc(S.name)} 개인 기록${sh.star?' <span class="ss-star">수훈 선수</span>':''}</p><div class="ss-grid">${cells.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('')}</div></div>`;
  })() : `<p class="muted">이 경기에는 출전하지 않았어요.</p>`;
  return `<details class="ss" ${open?'open':''}><summary>경기 기록지 <span class="muted">${esc(sh.label)}, ${esc(sh.opp)}전 ${sh.win?'승':'패'} ${won}:${lost}</span></summary>
    <div class="ss-body">
      <table class="ss-table"><tr><th class="l">팀</th>${cols.map((_,i)=>`<th>${i+1}세트</th>`).join('')}<th>세트</th></tr>
        <tr class="${sh.win?'w':''}"><td class="l">${esc(sh.team)}</td>${cols.map(s=>`<td>${s?s[0]:''}</td>`).join('')}<td><b>${won}</b></td></tr>
        <tr class="${sh.win?'':'w'}"><td class="l">${esc(sh.opp)}</td>${cols.map(s=>`<td>${s?s[1]:''}</td>`).join('')}<td><b>${lost}</b></td></tr></table>
      <table class="ss-table ss-team"><tr><th class="l">팀 기록</th><th>공격</th><th>블로킹</th><th>서브</th><th>상대 범실</th><th>총점</th></tr>
        <tr><td class="l">우리 팀</td><td>${sh.U.atk}</td><td>${sh.U.blk}</td><td>${sh.U.ace}</td><td>${sh.U.err}</td><td><b>${sh.U.atk+sh.U.blk+sh.U.ace+sh.U.err}</b></td></tr>
        <tr><td class="l">상대 팀</td><td>${sh.T.atk}</td><td>${sh.T.blk}</td><td>${sh.T.ace}</td><td>${sh.T.err}</td><td><b>${sh.T.atk+sh.T.blk+sh.T.ace+sh.T.err}</b></td></tr></table>
      ${myRow}
    </div></details>`;
}
function sheetsCard(){
  const a=S.sheets||[]; if(!a.length) return '';
  return `<section class="paper plain"><h3>최근 경기 기록지</h3><p class="muted" style="margin-top:0">구간마다 마지막 경기를 남겨 둬요.</p>${a.map((s,i)=>sheetHTML(s,i===0)).join('')}</section>`;
}

/* ---------- 감독과의 대화 ---------- */
function phaseKey(){ return S.season?`${S.year}-${S.season.idx}`:''; }
function canTalk(){ const ph=S.season&&curPhase(); return ph && !['nat','callup','awards'].includes(ph.k) && S.talked!==phaseKey() && S.stage!=='RETIRED'; }
function coachName(){ return S.stage==='HS'?'배구부 감독':S.stage==='UNI'?(S.team.league==='실업'?'실업팀 감독':'대학 감독'):S.stage==='ABROAD'?'외국인 감독':'감독'; }
function coachMood(){ return S.trust>=65?'warm':S.trust>=40?'flat':'cold'; }
function weakestKey(){ const ks=Object.keys(POS[S.pos].w).filter(isKey); return ks.sort((a,b)=>S.stats[a]-S.stats[b])[0]; }
function posOptions(){
  return Object.keys(POS).filter(p=>p!==S.pos).map(p=>({p,o:ovrOf(S.stats,p)})).sort((a,b)=>b.o-a.o);
}
const TALK = [
  {id:'time', t:'출전 기회를 더 받고 싶어요', show:()=>role().r!=='주전'&&!S.injured},
  {id:'tip',  t:'어떤 훈련에 집중하면 좋을까요?', show:()=>true},
  {id:'pos',  t:'포지션을 바꿔 보고 싶어요', show:()=>S.stage!=='HS'||S.grade>=2},
  {id:'tired',t:'요즘 몸이 많이 무거워요', show:()=>!S.injured},
  {id:'team', t:'팀 분위기에 대해 이야기하고 싶어요', show:()=>true},
];
function startTalk(){ S.talk={step:'menu',lines:[{who:'coach',t:coachGreeting()}]}; S.screen='coach'; save(); render(); }
function coachGreeting(){
  const m=coachMood();
  return m==='warm'?`${S.name}, 들어와. 무슨 일이야?`:m==='flat'?'그래, 할 말 있으면 해 봐.':'바쁘니까 짧게 말해.';
}
function talkSay(id){
  const T=S.talk; const say=TALK.find(x=>x.id===id).t;
  T.lines.push({who:'me',t:say});
  const reply=(t)=>T.lines.push({who:'coach',t});
  const k=weakestKey();
  if(id==='time'){
    const d=ovr()+(S.trust-50)*.1-teamReq();
    if(d>=-6){
      const p=clamp(.35+S.trust/200+(d+6)*.04,.1,.9);
      if(R()<p){ S.coachBoost={key:phaseKey(),v:4}; S.trust+=2; reply('좋아. 이번 구간엔 기회를 줘 보지. 실망시키지 마.'); T.res='이번 구간 출전 기회 증가, 감독 신뢰 +2'; }
      else { S.trust-=2; reply(`아직은 아니야. ${STATS[k]}부터 확실히 보여 줘.`); T.res='감독 신뢰 -2'; }
    }else{ S.trust+=1; reply(`솔직히 말할게. 지금 ${STATS[k]} ${Math.round(S.stats[k])}로는 어렵다. 조급해하지 말고 기본부터 다져.`); T.res='감독 신뢰 +1 (솔직한 피드백)'; }
  }else if(id==='tip'){
    S.coachTip={key:phaseKey(),k};
    reply(`네 약점은 ${STATS[k]}이야. 이번 구간에 그 훈련을 하면 내가 직접 봐 주지.`);
    T.res=`이번 구간 ${STATS[k]} 훈련 효과 1.35배`;
  }else if(id==='pos'){
    const opts=posOptions().slice(0,3);
    reply(`어디로 가고 싶은데? 내가 보기엔 ${POS[opts[0].p].n} 쪽이 제일 가능성이 있어.`);
    T.step='pos'; T.opts=opts; save(); render(); return;
  }else if(id==='tired'){
    if(S.cond<55){ S.cond=clamp(S.cond+15,0,100); S.trust-=1; reply('알았다. 이번 주 훈련량은 조절해 주지. 대신 경기 땐 제대로 해.'); T.res='컨디션 +15, 감독 신뢰 -1'; }
    else { S.trust-=3; reply('핑계 대지 마. 다들 그 정도는 힘들어.'); T.res='감독 신뢰 -3'; }

/* ---------- 라이벌 ---------- */
function newRival(o){
  const pool=schools(o.gender).filter((s,i)=>i!==o.school);
  const sc=pick(pool);
  return {name:pick(LAST)+pick(o.gender==='M'?FIRST_M:FIRST_F), school:sc.name, pot:clamp(Math.round(81+gauss()*5),74,95), ovr:ri(37,43), stage:'HS', team:sc.name, hist:[], awards:[], retired:false};
}
function rivalSeason(){
  const r=S.rival; if(!r||r.retired) return;
  const a=S.age;
  r.hist.push({age:a,ovr:r.ovr});
  const rate=a<=18?.2:a<=21?.18:a<=24?.12:a<=27?.06:0;
  r.ovr = r.ovr + Math.max(0,(r.pot+3-r.ovr))*rate + gauss()*1.2 - (a>=30?(a-29)*.6:0);
  r.ovr = clamp(Math.round(r.ovr*10)/10,20,98);
  const ro=Math.round(r.ovr);
  // 드래프트 (같은 학년)
  if(r.stage==='HS' && a>=18){
    const t=pick(krTeams());
    r.stage='PRO'; r.team=t.name;
    const rd= ro>=62?1: ro>=56?2:3;
    r.draft=`${rd}라운드`;
    pushNews({h:`라이벌 ${r.name}, 신인 드래프트 ${rd}라운드로 ${t.name} 입단`,b:`${r.school} 출신 ${POS[S.pos].n} ${r.name}이(가) 프로 무대에 선다.`,tag:'라이벌'});
    return;
  }
  if(r.stage==='PRO' || r.stage==='ABROAD'){
    const myMvp=S.awards.some(x=>x.y===S.year&&/정규리그 MVP/.test(x.t));
    if(ro>=87 && !myMvp && R()<.35){ const t=r.stage==='PRO'?'V리그 정규리그 MVP':'해외 리그 MVP'; r.awards.push({y:S.year,t}); pushNews({h:`라이벌 ${r.name}, ${t} 수상`,b:`${r.team} ${r.name}이(가) 올 시즌 최고의 선수로 뽑혔다.`,tag:'라이벌'}); }
    else if(ro>=80 && R()<.25){ const t='베스트7'; r.awards.push({y:S.year,t}); }
    if(r.stage==='PRO' && ro>=84 && a<=31 && R()<.2){ const L=pick(ABROAD.filter(x=>ro>=x.need)); if(L){ r.stage='ABROAD'; r.team=`${pick(L.teams[S.gender])} (${L.league})`; pushNews({h:`라이벌 ${r.name}, ${L.league} 진출`,b:`${r.name}이(가) 해외 무대에 도전한다.`,tag:'라이벌'}); } }
    if(a>=35 && R()<.35){ r.retired=true; pushNews({h:`라이벌 ${r.name}, 현역 은퇴`,b:`오랜 시간 ${S.name}과(와) 경쟁해 온 ${r.name}이(가) 코트를 떠난다.`,tag:'라이벌'}); }
  }
}
function rivalCard(){
  const r=S.rival; if(!r) return '';
  const me=S.history.map(h=>({age:h.age,ovr:h.ovr}));
  const all=[...me.map(x=>x.ovr),...r.hist.map(x=>x.ovr)];
  let chart='';
  if(me.length>=2 || r.hist.length>=2){
    const ages=[...me.map(x=>x.age),...r.hist.map(x=>x.age)];
    const a0=Math.min(...ages), a1=Math.max(...ages,a0+1), lo=Math.min(...all,40)-2, hi=Math.max(...all,60)+2;
    const X=a=>8+(a-a0)/(a1-a0)*284, Y=v=>92-(v-lo)/(hi-lo)*84;
    const pl=arr=>arr.map(p=>`${X(p.age).toFixed(1)},${Y(p.ovr).toFixed(1)}`).join(' ');
    chart=`<svg class="rv-chart" viewBox="0 0 300 100" role="img" aria-label="나와 라이벌의 종합 능력치 변화"><polyline points="${pl(r.hist)}" fill="none" stroke="#9AA6BD" stroke-width="2.5"/><polyline points="${pl(me)}" fill="none" stroke="#1D4E9E" stroke-width="2.5"/></svg>
      <p class="muted rv-legend"><i style="background:#1D4E9E"></i>${esc(S.name)} <i style="background:#9AA6BD"></i>${esc(r.name)}</p>`;
  }
  const lead = Math.round(r.ovr) - ovr();
  return `<article class="legend rival"><header><div><h3>라이벌 ${esc(r.name)}</h3><div class="muted">${POS[S.pos].n}, ${esc(r.school)} 출신${r.draft?`, ${r.draft} 지명`:''}</div></div>
    <div class="pct"><b>${Math.round(r.ovr)}</b><span>종합</span></div></header>
    <p>${r.retired?'은퇴했어요.':`지금 소속: ${esc(r.team)}.`} ${lead>0?`나보다 ${lead} 앞서 있어요.`:lead<0?`내가 ${-lead} 앞서 있어요.`:'나와 동률이에요.'}${r.awards.length?` 수상 ${r.awards.length}회 (${r.awards.slice(-2).map(a=>`${a.y} ${a.t}`).join(', ')}).`:''}</p>${chart}</article>`;
}

function underContract(){ return S.contractEnd && S.year < S.contractEnd; }
function buildOffers(){
  const o=ovr(), offers=[]; let id=0;
  const yrs=()=> S.age>=33?1: o>=82?3:2;
  if(S.stage==='PRO'){
    offers.push({id:id++,kind:'stay',team:S.team,salary:salaryFor(S.team,'PRO'),years:yrs()});
    const others=krTeams().filter(t=>t.name!==S.team.name).sort(()=>R()-.5).slice(0, o>=80?3:o>=72?2:1);
    for(const t of others){ const team=teamFrom(t,clamp(70+ri(-4,6),64,80)); offers.push({id:id++,kind:'kr',team,salary:r1(salaryFor(team,'PRO')*rnd(.95,1.2)),years:yrs()}); }
  }else{
    offers.push({id:id++,kind:'stay',team:S.team,salary:salaryFor(S.team,'ABROAD'),years:Math.min(2,yrs())});
    const t=pick(krTeams()); const team=teamFrom(t,clamp(72+ri(-2,5),64,80));
    offers.push({id:id++,kind:'kr',team,salary:r1(salaryFor(team,'PRO')*1.15),years:yrs()});
  }
  if(S.age<=33) for(const L of ABROAD){ if(L.league!==S.team.league && o>=L.need && R()<(S.agent?.75:.5)){ const t=abroadTeam(L); const team={name:t.name,e:t.e,color:t.color,rating:L.base+ri(-3,2),league:L.league,leagueBase:L.base}; offers.push({id:id++,kind:'abroad',team,salary:salaryFor(team,'ABROAD'),years:Math.min(2,yrs())}); } }
  return offers;
}
function expRole(team){
  const d=ovr()-(team.rating+2);
  return d>=0?'주전':d>=-5?'로테이션':d>=-10?'원포인트':'웜업존';
}
function haggle(id){
  const m=S.modal; const of=m.offers.find(x=>x.id===+id); if(!of||of.haggled) return;
  of.haggled=true;
  const p=clamp(.35+(ovr()-75)*.02+S.fame*.004,.1,.85);
  if(R()<p){ const before=of.salary; of.salary=r1(of.salary*rnd(1.1,1.22)); of.msg=`${before}억 → ${of.salary}억으로 올려 줬어요.`; addLog(`💰 ${of.team.name}과 연봉 협상 성공: ${of.salary}억`,'good'); }
  else { of.withdrawn = of.kind!=='stay'; of.msg = of.withdrawn?'무리한 요구라며 제안을 거둬들였어요.':'더는 올려 줄 수 없대요. 기존 조건은 유지돼요.'; addLog(`💸 ${of.team.name}과 연봉 협상 실패`,'bad'); }
  save(); render();
}
function takeOffer(id){
  const of=S.modal.offers.find(x=>x.id===+id); if(!of||of.withdrawn) return;

function offerCard(of){

function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function ledCanvas(c,str,x,y,p){

function teamLogo(name){ if(!name) return null; const m=logoMap(); return m[name] || (typeof DEFAULT_LOGOS!=='undefined' && DEFAULT_LOGOS[name]) || null; }

function setLogo(name,url){ const m=logoMap(); if(url) m[name]=url; else delete m[name]; try{ localStorage.setItem(LOGO_KEY,JSON.stringify(m)); return true; }catch(e){ return false; } }
function imageToLogo(file){
  return new Promise((res,rej)=>{
    if(!file || !/^image\//.test(file.type)) return rej(new Error('type'));
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ const N=128, cv=document.createElement('canvas'); cv.width=N; cv.height=N; const c=cv.getContext('2d');
      const k=Math.min(N/im.width,N/im.height); const w=im.width*k, h=im.height*k;
      c.imageSmoothingQuality='high'; c.drawImage(im,(N-w)/2,(N-h)/2,w,h); URL.revokeObjectURL(url);
      try{ res(cv.toDataURL('image/png')); }catch(e){ rej(e); } };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('load')); };
    im.src=url;
  });
}
const ALL_TEAMS=()=>[...TEAMS_M,...TEAMS_F];
function matchTeam(fname){
  const k=fname.replace(/\.[^.]+$/,'').replace(/[\s_\-]/g,'').toLowerCase();
  const norm=t=>t.replace(/\s/g,'').toLowerCase();
  return ALL_TEAMS().find(t=>k===norm(t.name)) || ALL_TEAMS().find(t=>k.includes(norm(t.name.split(' ')[0]))) || ALL_TEAMS().find(t=>t.e.length>=2 && k.includes(norm(t.e)));
}
async function importLogos(files){
  let ok=0, skip=[];
  for(const f of files){
    try{
      if(/\.json$/i.test(f.name) || f.type==='application/json'){
        const pack=JSON.parse(await f.text()); const L=pack&&pack.logos;
        if(!L || typeof L!=='object') throw new Error('pack');
        for(const [name,url] of Object.entries(L)){
          const t=ALL_TEAMS().find(x=>x.name===name);
          if(!t || typeof url!=='string' || !/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(url) || url.length>300000){ skip.push(name); continue; }
          if(setLogo(t.name,url)) ok++;
        }
      }else if(/^image\//.test(f.type)){
        const t=matchTeam(f.name); if(!t){ skip.push(f.name); continue; }
        if(setLogo(t.name, await imageToLogo(f))) ok++;
      }else skip.push(f.name);
    }catch(e){ skip.push(f.name); }
  }
  return ok ? `${ok}개 구단에 로고를 넣었어요.${skip.length?` 알아보지 못한 항목 ${skip.length}개는 건너뛰었어요.`:''}` : '넣을 수 있는 로고를 찾지 못했어요. 로고 묶음 파일(.json)이나 구단 이름이 파일명인 이미지를 골라 주세요.';
}

function hofLoad(){ try{ return JSON.parse(localStorage.getItem(HOF_KEY)||'[]')||[]; }catch(e){ return []; } }
function hofSave(h){ try{ h.sort((a,b)=>b.score-a.score); localStorage.setItem(HOF_KEY,JSON.stringify(h.slice(0,40))); return true; }catch(e){ return false; } }
function encodeRec(x){ return 'W2M1.'+btoa(unescape(encodeURIComponent(JSON.stringify({n:x.name,p:x.pos,g:x.gender,s:x.score,r:x.grade,k:x.peak,m:x.mvp,w:x.world,o:x.gold,e:x.end,d:x.d})))); }
function decodeRec(code){
  const m=String(code).replace(/\s/g,'').match(/W2M1\.([A-Za-z0-9+/=]+)/); if(!m) throw new Error('format');
  const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
  const int=(v,lo,hi)=>{ v=Math.round(+v); if(!isFinite(v)) throw new Error('num'); return clamp(v,lo,hi); };
  if(!POS[o.p] || !['M','F'].includes(o.g) || !['레전드','S','A','B','C','D'].includes(o.r)) throw new Error('field');
  return {name:String(o.n||'친구').slice(0,8),pos:o.p,gender:o.g,score:int(o.s,0,1500),grade:o.r,peak:int(o.k,0,99),mvp:int(o.m,0,60),world:int(o.w,0,20),gold:int(o.o,0,30),end:int(o.e,0,45),d:int(o.d,0,9e15),friend:true};
}

    const hof=hofLoad();

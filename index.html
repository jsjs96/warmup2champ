/* =========================================================
   도트 애니메이션 — 160x90 픽셀 장면
   ========================================================= */
const ANIM = (()=>{
  const W=160, H=90, FLOOR=76, FPS=12;
  let token=0;
  const reduce = typeof matchMedia!=='undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const poses={};
  function pose(name){
    if(poses[name]) return poses[name];
    const g=SPR.map(r=>r.split(''));
    const clearArms=()=>{ for(const y of [7,8,9]){ if(g[y][1]==='S')g[y][1]='.'; if(g[y][10]==='S')g[y][10]='.'; } };
    if(name==='up'){ clearArms(); for(let y=1;y<=6;y++){ g[y][1]='S'; g[y][10]='S'; } }
    if(name==='spike'){ clearArms(); for(let y=0;y<=6;y++) g[y][10]='S'; g[7][1]='S'; g[6][0]='S'; }
    if(name==='spikeL'){ clearArms(); for(let y=0;y<=6;y++) g[y][1]='S'; g[7][10]='S'; g[6][11]='S'; }
    if(name==='bump'){ clearArms(); g[9][3]='S'; g[9][8]='S'; for(let x=4;x<=7;x++) g[10][x]='S'; }
    return poses[name]=g;
  }
  function pal(o){
    return {H:o.hair||'#22160D',S:'#F0C29C',E:'#111',M:'#C46A58',J:o.color,N:o.num||'#FFFFFF',P:'#0F1B33',W:'#F8FAFC',K:o.shoe||'#E1252B'};
  }
  // 선수 그리기: x=왼쪽, y=발 위치 기준 (발이 y에 닿음)
  function man(c,x,y,p,o){
    if(p==='spike' && o.lefty) p='spikeL';
    const g=pose(p), cl=pal(o), top=Math.round(y)-16, lx=Math.round(x);
    for(let r=0;r<16;r++) for(let q=0;q<12;q++){
      const ch=g[r][o.flip?11-q:q]; const col=cl[ch];
      if(col){ c.fillStyle=col; c.fillRect(lx+q,top+r,1,1); }
    }
    if(o.f){ c.fillStyle=cl.H; c.fillRect(lx+(o.flip?1:9),top+2,2,1); c.fillRect(lx+(o.flip?1:10),top+3,1,3); }
  }
  function lying(c,x,y,o){ // 누운 자세 (회전)
    const g=pose('stand'), cl=pal(o);
    for(let r=0;r<16;r++) for(let q=0;q<12;q++){ const col=cl[g[r][q]]; if(col){ c.fillStyle=col; c.fillRect(Math.round(x)+r,Math.round(y)-12+q,1,1);} }
  }
  function shadow(c,x,w){ c.fillStyle='rgba(0,0,0,.28)'; c.fillRect(Math.round(x)+2,FLOOR,w||8,1); }
  function ball(c,x,y){
    x=Math.round(x); y=Math.round(y);
    c.fillStyle='#FFB020'; c.fillRect(x-1,y-1,3,3);
    c.fillStyle='#1D4E9E'; c.fillRect(x,y-1,1,1); c.fillRect(x-1,y,1,1);
    c.fillStyle='#fff'; c.fillRect(x+1,y+1,1,1);
  }
  const lerp=(a,b,t)=>a+(b-a)*t;
  const seg=(f,a,b)=>Math.max(0,Math.min(1,(f-a)/(b-a)));
  function arc(x0,y0,x1,y1,h,t){ return [lerp(x0,x1,t), lerp(y0,y1,t)-h*4*t*(1-t)]; }
  const jump=(f,a,b,h)=> (f<a||f>b)?0:-h*Math.sin(Math.PI*(f-a)/(b-a));
  function puff(c,x,y,k,col){
    if(k<0||k>1) return;
    c.fillStyle=col||'#FFFFFF';
    const r=2+k*7;
    for(let i=0;i<8;i++){ const a=i*Math.PI/4; c.fillRect(Math.round(x+Math.cos(a)*r),Math.round(y-Math.abs(Math.sin(a))*r*.7),1,1); }
  }
  const DIG=['111101101101111','010110010010111','111001111100111','111001111001111','101101111001001','111100111001111','111100111101111','111001001001001','111101111101111','111101111001111'];
  function digits(c,x,y,n,col){
    String(n).split('').forEach((d,i)=>{ const g=DIG[+d]; for(let k=0;k<15;k++) if(g[k]==='1'){ c.fillStyle=col; c.fillRect(x+i*4+k%3,y+Math.floor(k/3),1,1);} });
  }
  function court(c,o,score){

function led(str,p,color){
  str=String(str); p=p||3; color=color||'#FFB020';
  const W=str.length*6*p-p, H=7*p, r=p*0.42;
  let dots='';
  [...str].forEach((ch,ci)=>{
    const g=LED_FONT[ch]||LED_FONT[' '];
    for(let i=0;i<35;i++){
      const x=ci*6*p+(i%5)*p+p/2, y=Math.floor(i/5)*p+p/2;
      dots+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${g[i]==='1'?color:'rgba(255,176,32,.09)'}"/>`;
    }
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(str)}">${dots}</svg>`;
}
function ledNum(v,len){ return String(v).padStart(len||2,' '); }

const SPR = [
"....HHHH....","...HHHHHH...","..HHSSSSH...","..HSESSES...","...SSSSSS...","....SMMS....",
"..JJJJJJJJ..",".SJJJNNJJJS.",".SJJJNNJJJS.",".S.JJJJJJ.S.","...JJJJJJ...","...PPPPPP...",
"...PP..PP...","...SS..SS...","...WW..WW...","..KKK..KKK..",
];
function drawSprite(cv,o){
  if(!cv) return;
  const ctx=cv.getContext('2d'); cv.width=12; cv.height=16;
  const libero=o.pos==='L';
  const col={H:'#22160D',S:'#F0C29C',E:'#111',M:'#C46A58',J:libero?'#FFB020':(o.color||'#1D4E9E'),N:'#FFFFFF',P:'#0F1B33',W:'#F8FAFC',K:'#E1252B'};
  if(!libero && (o.color||'').toLowerCase()==='#1d4e9e') col.J='#E8EEF9', col.N='#1D4E9E';
  ctx.clearRect(0,0,12,16);
  SPR.forEach((row,y)=>{[...row].forEach((ch,x)=>{ if(col[ch]){ctx.fillStyle=col[ch];ctx.fillRect(x,y,1,1);} });});
  if(o.gender==='F'){ ctx.fillStyle=col.H; ctx.fillRect(9,2,2,1); ctx.fillRect(10,3,1,3); }
}
function drawBall(cv){
  if(!cv) return;
  const ctx=cv.getContext('2d'); cv.width=6; cv.height=6;
  const m=["..YY..",".YBBW.","YWWBYY","YYBWWB",".BWYY.","..BB.."];
  const c={Y:'#FFB020',B:'#1D4E9E',W:'#ffffff'};
  m.forEach((r,y)=>[...r].forEach((ch,x)=>{if(c[ch]){ctx.fillStyle=c[ch];ctx.fillRect(x,y,1,1);}}));
}
function segs(v,cls){
  const n=Math.round(clamp(v,0,100)/10);
  return `<div class="seg ${cls}">${Array.from({length:10},(_,i)=>`<b class="${i<n?'on':''}"></b>`).join('')}</div>`;
}

function render(){
  const app=document.getElementById('app');
  if(showLogos){ app.innerHTML=logosView(); bindLogos(); return; }
  if(!S){ app.innerHTML=titleScreen(); bindTitle(); return; }
  if(S.screen==='create'){ app.innerHTML=createScreen(); bindCreate(); return; }
  let body='';
  if(['contract','interview','coach'].includes(S.screen)) tab='play';
  if(S.screen==='contract') body=contractView();
  else if(S.screen==='coach') body=coachView();
  else if(S.screen==='interview') body=interviewView();
  else if(tab==='compare') body=compareView();
  else if(tab==='stats') body=statsView();
  else if(tab==='career') body=careerView();
  else if(tab==='trophy') body=trophyView();
  else body=playView();
  app.innerHTML=`<div class="layout"><aside class="side">${header()}${S.stage!=='RETIRED'?logCard('log-side'):''}</aside><div class="main">`+body+`<footer class="foot">KOVO 및 각 구단과 무관한 비공식 팬메이드 게임이에요. 구단명·학교명·선수 정보의 권리는 각 권리자에게 있어요. 구단 로고의 권리는 각 구단에 있어요. 진행 상황은 이 브라우저에 자동 저장돼요.<br><button data-act="logos">구단 로고 넣기</button> <button data-act="reset">새 커리어 시작</button></footer></div>${railHTML()}</div>`;
  drawSprite(document.getElementById('spr'),{pos:S.pos,gender:S.gender,color:S.team.color});
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
  app.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset.arg));
  ANIM.mount(app);
  if(S.screen==='contract') bindContract();
  bindShare(); bindHof(app);
}
function act(a,arg){
  if(a==='reset'){ if(S.stage!=='RETIRED' && !S.confirmReset){ S.confirmReset=true; tab='play'; render(); return; } wipe(); tab='play'; render(); return; }
  if(a==='logos'){ showLogos=true; render(); return; }
  if(a==='cancelReset'){ S.confirmReset=false; render(); return; }
  if(a==='train'){ phaseAction(arg); return; }
  if(a==='event'){ chooseEvent(+arg); return; }
  if(a==='clutch'){ chooseClutch(+arg); return; }
  if(a==='clutchGo'){ S.modal=null; S.screen='phase'; runTour(curPhase()); return; }
  if(a==='next'){ nextPhase(); return; }
  if(a==='endSeason'){ S.modal=null; nextPhase(); return; }
  if(a==='off'){ const [k,v]=arg.split('|'); offseasonChoice(k,v); return; }
  if(a==='draftGo'){ if(S.iv&&S.iv.next==='draft'){ S.screen='interview'; save(); render(); return; } S.modal=null; acceptDraft(); return; }
  if(a==='iv'){ answerIv(+arg); return; }
  if(a==='callup'){ callupChoice(arg); return; }
  if(a==='talkStart'){ startTalk(); return; }
  if(a==='talk'){ talkSay(arg); return; }
  if(a==='talkPos'){ talkPos(arg); return; }
  if(a==='talkEnd'){ endTalk(); return; }
  if(a==='inj'){ injuryChoice(arg); return; }
  if(a==='haggle'){ haggle(arg); return; }
  if(a==='take'){ takeOffer(arg); return; }
  if(a==='draftFail'){ draftFailChoice(arg); return; }
}

function seasonHead(){
  if(!S.season) return '';
  const n=S.season.phases.length, idx=S.season.idx;
  return `<div class="season-head"><span class="yr">${seasonLabel()}</span><span class="wl">${S.season.w+S.season.l?`${S.season.w}승 ${S.season.l}패`:''}</span></div>
  <div class="steps" aria-label="시즌 진행 ${idx+1}/${n}">${S.season.phases.map((_,i)=>`<i class="${i<idx?'done':i===idx?'now':''}"></i>`).join('')}</div>`;
}

}
function callupView(){
  const i=callupInfo();
  const nat=S.gender==='M'?'남자':'여자';
  return `<section class="paper plain callup">${seasonHead()}
    <div class="doc">
      <p class="muted" style="margin:0">${S.year}년 ${nat} 배구 국가대표팀</p>
      <h2>소집 통보</h2>
      <dl class="terms">
        <div><dt>받는 사람</dt><dd>${esc(S.name)} (${esc(S.team.name)})</dd></div>
        <div><dt>포지션</dt><dd>${POS[S.pos].n}</dd></div>
        <div><dt>출전 대회</dt><dd>${i.comps.join(', ')}</dd></div>
        <div><dt>예상 역할</dt><dd>${i.captain?'주장':i.role}</dd></div>
      </dl>
      <p>위 선수를 국가대표로 선발했기에 소집을 알립니다. 소속팀은 선수의 대표팀 합류에 협조해 주시기 바랍니다.</p>
    </div>
    ${newsHTML(S.news)}
    <h3 style="margin-top:14px">어떻게 할까요?</h3>
    <button class="btn go" data-act="callup" data-arg="accept">소집에 응하기<small>국제대회 출전, 인기 상승. 대표팀 경기는 컨디션을 깎아요${i.captain?'. 주장 완장도 받습니다':''}</small></button>
    <button class="btn" data-act="callup" data-arg="decline">몸 관리를 이유로 고사하기<small>컨디션 +25, 소속팀 신뢰 +3, 인기 -6. 핵심 선수면 다음 해 명단에서 빠져요</small></button>
    ${i.canRetire?`<button class="btn" data-act="callup" data-arg="retire">대표팀 은퇴 선언하기<small>앞으로 소집되지 않아요. 소속팀에만 집중합니다</small></button>`:''}
  </section>`;
}
function railHTML(){
  if(S.stage==='RETIRED') return '';
  const news = S.news&&S.news.length ? `<section class="paper plain">${newsHTML(S.news)}</section>` : '';
  return `<aside class="rail" aria-label="뉴스와 기록지">${news}${logCard('log-rail')}</aside>`;
}
function logCard(cls){
  if(!S.log) return '';
  return `<section class="paper plain ${cls}"><h3>기록지</h3><div class="log">${S.log.slice(0,40).map(l=>`<p class="${l.c}">${esc(l.t)}</p>`).join('')}</div></section>`;
}
function postDesc(ph){
  if(!ph.rounds) return `정규리그 ${S.season.rank}위로 봄배구 진출에 실패했어요.`;
  return `정규리그 ${S.season.rank}위로 진출했어요. ${ph.rounds.map(r=>r[0]).join(', 이어서 ')}.`;
}
function roleHint(){
  const d=ovr()+(S.trust-50)*0.1-teamReq();
  if(S.injured>0) return '재활에 집중하세요.';
  if(d>=0) return '팀의 핵심 전력이에요.';
  if(d>=-5) return `주전까지 능력치와 신뢰 합계로 약 ${Math.ceil(-d)} 남았어요.`;
  if(d>=-10) return `짧은 투입 기회만 와요. 주전까지 약 ${Math.ceil(-d)} 남았어요.`;
  return `주전까지 약 ${Math.ceil(-d)} 남았어요. 핵심 훈련과 영상 분석으로 감독 신뢰를 쌓으세요.`;
}
function seasonGrid(r){
  const p=S.pos;
  const cells=[['경기',r.gp]];
  if(p==='S') cells.push(['세트',r.ast]);
  if(p!=='L') cells.push(['득점',r.pts]);
  if(p!=='L'&&p!=='S') cells.push(['공격 성공률',r.atk!=null?r.atk+'%':'-']);
  if(p!=='L') cells.push(['블로킹',r.blk],['서브',r.ace]);
  if(p==='L'||p==='OH') cells.push(['리시브 효율',r.rcv!=null?r.rcv+'%':'-']);
  cells.push(['디그',r.dig]);
  cells.push(['종합',r.ovr]);
  const c=cells.slice(0,8); while(c.length%4) c.push(['','']);
  return `<div class="sheet">${c.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('')}</div>`;
}
function statsView(){
  let h=`<section class="paper plain"><h2>능력치</h2><p class="muted">진하게 표시된 항목이 ${POS[S.pos].n}의 종합 능력치에 크게 반영돼요.</p>`;
  for(const k in STATS){
    const v=S.stats[k]; const key=isKey(k);
    h+=`<div class="stat ${key?'key':''}"><span class="k">${STATS[k]}</span><div class="meter"><i style="width:${v}%"></i></div><span class="v">${Math.round(v)}</span></div>`;
  }
  const potTxt = S.age<20?'아직 판단하기 이르다':S.pot>=91?'월드클래스 재능':S.pot>=85?'국가대표급 재능':S.pot>=79?'1군 주전급 재능':'노력으로 올라온 선수';
  h+=`<div class="sheet" style="margin-top:14px"><div><span>코치 평가</span><b style="font-size:15px">${potTxt}</b></div><div><span>결정적 순간</span><b>${S.clutch.w}/${S.clutch.t}</b></div><div><span>대표팀 출전</span><b>${S.nat.caps}${S.nat.captain?' ©':''}</b></div><div><span>메달</span><b>${S.nat.medals.length}</b></div></div>${S.nat.retired?'<p class="muted">대표팀에서 은퇴했어요.</p>':''}</section>`;
  h+=`<section class="paper plain"><h3>성장 가이드</h3><ul class="report">
    <li style="font-weight:400">20대 초반까지 훈련 효율이 가장 높고, 30세부터 점프력과 체력이 떨어져요.</li>
    <li>종합 73이면 대표팀, 78부터 해외 리그 제안이 와요.</li>
    <li>결정적 순간의 성공률은 관련 능력치와 컨디션으로 정해져요.</li>
    <li>최종 목표는 올해의 세계 배구선수입니다.</li></ul></section>`;
  return h;
}
function careerView(){
  if(!S.history.length) return `<section class="paper plain"><h2>시즌 기록</h2><p class="empty">첫 시즌을 마치면 여기에 기록이 쌓여요.</p></section>`;
  const p=S.pos;
  let h=`<section class="paper plain"><h2>시즌 기록</h2><div class="tablewrap"><table><tr><th>시즌</th><th class="l">팀</th><th class="l">역할</th><th>경기</th>${p==='S'?'<th>세트</th>':''}${p!=='L'?'<th>득점</th>':''}${p!=='L'&&p!=='S'?'<th>공격%</th>':''}${p==='MB'||p==='OP'?'<th>블록</th>':''}${p==='L'||p==='OH'?'<th>리시브%</th>':''}<th>디그</th><th>종합</th></tr>`;
  for(const r of S.history){
    h+=`<tr><td>${r.label.replace(' 시즌','')}</td><td class="l">${esc(r.team)}</td><td class="l">${roleLabel(r.role)}</td><td>${r.gp}</td>${p==='S'?`<td>${r.ast}</td>`:''}${p!=='L'?`<td>${r.pts}</td>`:''}${p!=='L'&&p!=='S'?`<td>${r.atk??'-'}</td>`:''}${p==='MB'||p==='OP'?`<td>${r.blk}</td>`:''}${p==='L'||p==='OH'?`<td>${r.rcv??'-'}</td>`:''}<td>${r.dig}</td><td><strong>${r.ovr}</strong></td></tr>`;
  }
  h+=`</table></div><div class="sheet"><div><span>통산 경기</span><b>${S.career.gp}</b></div><div><span>${S.pos==='S'?'통산 세트':'통산 득점'}</span><b>${S.pos==='S'?S.career.ast:S.career.pts}</b></div><div><span>블로킹</span><b>${S.career.blk}</b></div><div><span>디그</span><b>${S.career.dig}</b></div></div></section>`;
  return h+sheetsCard()+shareCardSection()+contractsCard()+newsArchiveCard();
}
function trophyView(){
  let h=`<section class="paper plain"><h2>트로피 장식장</h2>`;
  if(!S.awards.length) h+=`<p class="empty">아직 비어 있어요. 대회 우승이나 개인상을 받으면 여기에 놓입니다.</p>`;
  else{
    const cnt={}; S.awards.forEach(a=>{const k=a.t; cnt[k]=cnt[k]||{n:0,y:[],ic:a.ic,w:a.w||0}; cnt[k].n++; cnt[k].y.push(a.y);});
    Object.entries(cnt).sort((a,b)=>b[1].w-a[1].w).forEach(([t,c])=>{
      h+=`<div class="trophy"><div class="ic" aria-hidden="true">${c.ic}</div><div>${esc(t)}<div class="muted">${c.y.join(', ')}</div></div><span class="n">${c.n}회</span></div>`; });
  }
  return h+`</section>`+hofCard();
}
function endView(){
  const f=S.final;
  const peak=Math.max(...S.history.map(x=>x.ovr),0);
  const mvps=S.awards.filter(a=>/MVP/.test(a.t)).length;
  const g = f.grade==='레전드'?'LGND':f.grade;
  return `<section class="paper plain"><p class="muted" style="margin:0">커리어 종료</p><h2>${esc(S.retireMsg)}</h2>
    <div class="mini-board"><span class="side">최종 등급</span>${led(g,5)}<span class="side me">${f.score}점</span></div>
    <p>${endingText()}</p>
    <div class="sheet"><div><span>시즌</span><b>${S.history.length}</b></div><div><span>최고 종합</span><b>${peak}</b></div><div><span>MVP</span><b>${mvps}</b></div><div><span>세계 MVP</span><b>${S.worldMVP||0}</b></div>
    <div><span>통산 경기</span><b>${S.career.gp}</b></div><div><span>통산 득점</span><b>${S.career.pts}</b></div><div><span>대표팀 출전</span><b>${S.nat.caps}</b></div><div><span>메달</span><b>${S.nat.medals.length}</b></div></div>
    ${myCodeCard()}
    <button class="btn go" data-act="reset">새 커리어 시작</button></section>${shareCardSection()}${hofCard()}`;
}
function endingText(){
  if(S.worldMVP) return `웜업존에서 시작한 선수가 세계 최고가 되었어요. ${S.name}의 이름은 배구 역사에 남습니다.`;
  if(S.awards.some(a=>/올림픽 금메달/.test(a.t))) return '올림픽 금메달. 한국 배구의 새 역사를 쓴 주인공이에요.';
  if(S.awards.some(a=>/MVP/.test(a.t)&&!/대회|컵|연맹|전국|U-리그|대학/.test(a.t))) return '리그를 지배한 MVP. 한 시대를 대표한 선수로 기억될 거예요.';
  if(S.history.some(h=>h.league!=='고교'&&h.league!=='대학'&&h.role==='주전')) return '프로 무대에서 주전으로 뛴, 팬들이 사랑한 선수였어요.';
  if(S.history.some(h=>h.league==='V리그')) return '화려하진 않았지만 웜업존에서도 늘 최선을 다한 프로였어요.';
  return '프로의 문턱은 높았어요. 그래도 배구를 사랑한 시간은 진짜였습니다.';
}

/* ---------- 타이틀 & 생성 ---------- */
function titleScreen(){
  const saved=load();
  const live = saved && saved.stage!=='RETIRED';
  return `<div class="title-wrap"><div class="title-hero"><header class="board title-board" aria-label="전광판">
      <div class="score-line">
        <div class="team home">웜업존<small>고교 벤치</small></div>
        ${led(' 0: 0',5.2)}
        <div class="team away">MVP<small>세계 최고</small></div>
      </div>
      <div class="set-no">커리어 1세트 시작 전</div>
    </header>
    <div class="title">
      <h1>웜업존에서<br>MVP까지</h1>
      <p>고교 배구부 벤치에서 시작해 프로 데뷔, 주전, 국가대표, 해외 진출을 거쳐 올해의 세계 배구선수에 도전하는 배구 커리어 시뮬레이션.</p>
    </div>
    </div><div class="title-act">${sceneHTML('rally',{win:true,loop:true,score:'24:24',label:'랠리 장면'})}
    ${live?`<button class="btn go" id="cont">이어하기<small>${esc(saved.name)}, ${saved.age}세, ${esc(saved.team.name)}</small></button>`:''}
    <button class="btn ${live?'':'go'}" id="new" ${live?'style="text-align:center"':''}>새 커리어 시작</button>
    <button class="btn quiet" id="logosBtn">구단 로고 넣기</button>
    </div></div>${hofCard()}`;
}
function bindTitle(){
  ANIM.mount(document.getElementById('app')); bindHof(document.getElementById('app'));
  document.getElementById('logosBtn').onclick=()=>{ showLogos=true; render(); };
  const c=document.getElementById('cont'); if(c) c.onclick=()=>{S=load(); tab='play'; render();};
  document.getElementById('new').onclick=()=>{ S={screen:'create'}; draft={name:randName('M'),gender:'M',pos:'OH',height:190,school:2,talent:'균형형',hand:'R'}; render(); };
}
function randName(g){ return pick(LAST)+pick(g==='M'?FIRST_M:FIRST_F); }
function createScreen(){
  const d=draft;
  const hRange = d.gender==='M'?[172,206]:[162,194];
  const sg=(k,v,label,sub)=>`<button aria-pressed="${d[k]==v}" data-k="${k}" data-v="${v}">${label}${sub?`<small>${sub}</small>`:''}</button>`;
  const posDesc={OH:'리시브와 공격을 함께 맡는 살림꾼',OP:'점수를 책임지는 해결사',MB:'블로킹과 속공으로 네트를 지키는 벽',S:'볼 배분으로 경기를 지휘하는 사령관',L:'수비 전문, 혼자 다른 색 유니폼'};
  return `<section class="paper plain"><h2>선수 등록</h2><p class="muted" style="margin-top:0">고등학교 배구부 입단 신청서예요.</p>
    <div class="field"><div class="label">이름</div><div class="namebox"><input type="text" id="nm" maxlength="8" value="${esc(d.name)}" aria-label="이름"><button class="btn" id="rn" style="width:auto;margin:0" aria-label="이름 무작위로 바꾸기">다른 이름</button></div></div>
    <div class="field"><div class="label">출전 부문</div><div class="seg-ctl c2">${sg('gender','M','남자부')}${sg('gender','F','여자부')}</div></div>
    <div class="field"><div class="label">주로 쓰는 손 <span>왼손잡이는 공격 각도가 달라 아포짓·아웃사이드·세터에서 유리해요</span></div><div class="seg-ctl c2">${sg('hand','R','오른손잡이')}${sg('hand','L','왼손잡이','희귀한 무기')}</div></div>
    <div class="field"><div class="label">포지션</div><div class="pos-list">${Object.keys(POS).map(k=>`<button class="pos" aria-pressed="${d.pos===k}" data-k="pos" data-v="${k}"><b>${POS[k].s}</b><span>${POS[k].n}<small>${posDesc[k]}</small></span></button>`).join('')}</div></div>
    <div class="field"><div class="label">키 <span><strong id="hv">${d.height}</strong>cm, 클수록 블로킹과 점프가 좋고 수비는 어려워요</span></div>
      <input type="range" id="ht" min="${hRange[0]}" max="${hRange[1]}" value="${d.height}" aria-label="키"></div>
    <div class="field"><div class="label">성장 유형</div><div class="seg-ctl c3">${sg('talent','노력파','노력파','훈련 효율 높음')}${sg('talent','균형형','균형형','무난함')}${sg('talent','천재형','천재형','잠재력 높음')}</div></div>
    <div class="field"><div class="label">입학할 고등학교</div>${schools(d.gender).map((s,i)=>`<button class="pos" aria-pressed="${d.school==i}" data-k="school" data-v="${i}" style="grid-template-columns:1fr;margin-bottom:6px"><span><strong>${s.name}</strong> <span class="muted">${s.tag}, 팀 전력 ${s.rating}</span><small>${s.desc}</small></span></button>`).join('')}</div>
    <button class="btn go" id="go" style="margin-top:18px">입단하고 커리어 시작</button>
    <button class="btn quiet" id="back">처음으로</button></section>`;
}
function bindCreate(){
  const app=document.getElementById('app');
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; let v=b.dataset.v; if(k==='school') v=+v;
    draft.name=document.getElementById('nm').value||draft.name;
    if(k==='gender' && v!==draft.gender){ draft.height = v==='M'?190:178; if(/^.{3}$/.test(draft.name)) draft.name=randName(v); }
    draft[k]=v; render();
  });
  const ht=document.getElementById('ht');
  ht.oninput=()=>{draft.height=+ht.value; document.getElementById('hv').textContent=ht.value;};
  document.getElementById('rn').onclick=()=>{draft.name=randName(draft.gender); render();};
  document.getElementById('back').onclick=()=>{S=null; render();};
  document.getElementById('go').onclick=()=>{
    const nm=(document.getElementById('nm').value||'').trim()||randName(draft.gender);
    draft.name=nm.slice(0,8);
    newCareer(draft); tab='play'; render();
  };
}

if(typeof document!=='undefined') render();

</script>
